<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PayPilot — New Way International</title>
<meta name="description" content="PayPilot: payment runs, chasing, queries, remittances and cash forecast for New Way International.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6D4AFF">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PayPilot">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>/* ═══ PayPilot — bright theme (Plus Jakarta Sans + Syne, like Resell & Co) ═══ */
:root{
  --bg:#F6F7FD; --surface:#ffffff; --surface2:#F8F9FE; --surface3:#EEF0FA; --line:#E9EBF5; --line2:#D9DCEC;
  --ink:#151A36; --ink2:#4A5274; --ink3:#8C92B0;
  --brand:#5B4BF5; --brand2:#8B5CF6; --brand-bg:#EEECFF; --brand-ink:#fff;
  --grad:linear-gradient(120deg,#3B82F6 0%,#6D4AFF 45%,#C026D3 80%,#F43F5E 100%);
  --grad-soft:linear-gradient(120deg,#E7F0FF 0%,#EFE9FF 50%,#FDE8F3 100%);
  --gold:#F5B014; --gold-l:#FFD666;
  --ok:#059669; --ok-bg:#E3F8EF; --warn:#C27803; --warn-bg:#FFF5D6; --bad:#E11D48; --bad-bg:#FFE7EC;
  --orange:#EA580C; --orange-bg:#FFEDE0; --violet:#7C3AED; --violet-bg:#F1EAFF; --info:#0284C7; --info-bg:#E2F3FD; --mute-bg:#F0F1F7;
  --mint:#E3F8EF; --peach:#FFEFE3; --lilac:#F0EBFF; --sky:#E4F1FF; --pink:#FFE8F1; --lemon:#FFF7D6;
  --c-committed:#10B981; --c-expected:#6D4AFF; --c-risk:#F59E0B; --c-query:#EA580C;
  --navy:#16123B; --navy2:#2A1F6B;
  --r:18px; --rs:11px; --sh:0 1px 2px rgba(35,30,90,.04),0 8px 24px rgba(35,30,90,.06); --shm:0 18px 50px rgba(35,30,90,.22);
  --ease:cubic-bezier(.22,.9,.32,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; --display:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0D0B1E; --surface:#17142F; --surface2:#1C1838; --surface3:#241F45; --line:#2B2552; --line2:#3A3270;
  --ink:#F1EEFF; --ink2:#C2BCE6; --ink3:#8E87B8; --brand:#8B7BFF; --brand-bg:#2A2360;
  --grad-soft:linear-gradient(120deg,#1B2350 0%,#291F55 50%,#3A1A42 100%);
  --ok:#34D399; --ok-bg:#0F2E25; --warn:#FBBF24; --warn-bg:#33270B; --bad:#FB7185; --bad-bg:#3B1522; --orange:#FB923C; --orange-bg:#3A2112;
  --violet:#C4B5FD; --violet-bg:#2A1F55; --info:#38BDF8; --info-bg:#0E2A3D; --mute-bg:#221D42;
  --mint:#0F2E25; --peach:#35210F; --lilac:#2A2058; --sky:#10264A; --pink:#3A1630; --lemon:#33290C; --c-expected:#8B7BFF;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0D0B1E; --surface:#17142F; --surface2:#1C1838; --surface3:#241F45; --line:#2B2552; --line2:#3A3270;
  --ink:#F1EEFF; --ink2:#C2BCE6; --ink3:#8E87B8; --brand:#8B7BFF; --brand-bg:#2A2360;
  --grad-soft:linear-gradient(120deg,#1B2350 0%,#291F55 50%,#3A1A42 100%);
  --ok:#34D399; --ok-bg:#0F2E25; --warn:#FBBF24; --warn-bg:#33270B; --bad:#FB7185; --bad-bg:#3B1522; --orange:#FB923C; --orange-bg:#3A2112;
  --violet:#C4B5FD; --violet-bg:#2A1F55; --info:#38BDF8; --info-bg:#0E2A3D; --mute-bg:#221D42;
  --mint:#0F2E25; --peach:#35210F; --lilac:#2A2058; --sky:#10264A; --pink:#3A1630; --lemon:#33290C; --c-expected:#8B7BFF;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:'cv11' 1,'ss01' 1}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(600px 380px at 85% -60px,rgba(192,38,211,.12),transparent 70%),radial-gradient(700px 420px at 30% -120px,rgba(59,130,246,.14),transparent 70%),radial-gradient(500px 400px at 100% 100%,rgba(245,176,20,.08),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
::selection{background:#d9d2ff}
.num,.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--ink3)} .small{font-size:12px} .xs{font-size:11px} .b{font-weight:700} .right{text-align:right} .nowrap{white-space:nowrap}
.hide{display:none!important}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ── layout ── */
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
.side{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid var(--line);color:var(--ink2);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;gap:4px;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 22px}
.brand-mark{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 22px rgba(109,74,255,.42);position:relative;overflow:hidden}
.brand-mark::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-120%);animation:shine 5s 1.5s infinite}
@keyframes shine{0%,70%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.brand-name{font-family:var(--display);font-weight:800;font-size:21px;color:var(--ink);letter-spacing:-.02em}
.brand-sub{font-size:10.5px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.nav{display:flex;flex-direction:column;gap:3px;position:relative}
.nav button{all:unset;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;cursor:pointer;color:var(--ink2);font-weight:600;font-size:13.5px;position:relative;transition:background .18s,color .18s,transform .18s var(--spring)}
.nav button:hover{background:var(--surface3);color:var(--ink);transform:translateX(2px)}
.nav button.on{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(109,74,255,.32)}
.nav button.on svg{opacity:1}
.nav svg{width:19px;height:19px;flex:none;opacity:.85}
.nav .badge{margin-left:auto}
.nav button.on .badge{background:#fff;color:var(--bad)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:12px 4px 0;border-top:1px solid var(--line)}
.side-foot .chip{justify-content:flex-start;background:var(--surface2)}
.streak-card{background:var(--grad-soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;cursor:pointer}
.streak-card .fire{font-size:22px;animation:flick 1.8s infinite}
@keyframes flick{50%{transform:scale(1.12) rotate(-4deg)}}
.streak-card b{font-family:var(--display);font-size:17px}
.build{font-size:10.5px;color:var(--ink3);padding:4px 6px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 30px;display:flex;align-items:center;gap:14px}
.top h1{font-family:var(--display);font-size:23px;margin:0;font-weight:800;letter-spacing:-.02em}
.top .sub{font-size:12px;color:var(--ink3);font-weight:500}
.search{position:relative;margin-left:auto;width:min(360px,40vw)}
.search input{width:100%;height:40px;border:1px solid var(--line2);border-radius:13px;background:var(--surface);padding:0 12px 0 38px!important;outline:none;transition:box-shadow .2s,border-color .2s}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-bg)}
.search svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--ink3)}
.search-res{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shm);max-height:420px;overflow:auto;display:none;z-index:40}
.search-res.open{display:block;animation:pop .16s var(--ease)}
.search-res .sr{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.search-res .sr:hover,.search-res .sr.on{background:var(--brand-bg)}
.content{padding:24px 30px 70px;max-width:1520px;width:100%}
.panel{display:none} .panel.on{display:block;animation:rise .35s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.stagger>*{animation:rise .45s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.04s}.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.12s}.stagger>*:nth-child(5){animation-delay:.16s}.stagger>*:nth-child(6){animation-delay:.2s}.stagger>*:nth-child(7){animation-delay:.24s}.stagger>*:nth-child(8){animation-delay:.28s}

/* ── hero greeting ── */
.hello{position:relative;border-radius:24px;padding:22px 26px;margin-bottom:18px;background:var(--grad);color:#fff;overflow:hidden;box-shadow:0 14px 40px rgba(109,74,255,.28)}
.hello::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 160px at 85% 20%,rgba(255,255,255,.28),transparent 70%),radial-gradient(200px 140px at 10% 120%,rgba(255,214,102,.35),transparent 70%)}
.hello .stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,rgba(255,255,255,.8),transparent),radial-gradient(1.5px 1.5px at 70% 60%,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 40% 80%,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 90% 15%,rgba(255,255,255,.8),transparent),radial-gradient(1.5px 1.5px at 55% 25%,rgba(255,255,255,.6),transparent);animation:twinkle 4s infinite alternate}
@keyframes twinkle{to{opacity:.4}}
.hello-row{position:relative;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hello h2{font-family:var(--display);font-size:27px;margin:0;letter-spacing:-.02em;font-weight:800}
.hello p{margin:4px 0 0;opacity:.92;font-size:14px;font-weight:500}
.hello .plane{font-size:38px;animation:fly 3.4s var(--ease) infinite alternate}
@keyframes fly{from{transform:translate(0,4px) rotate(-6deg)}to{transform:translate(8px,-6px) rotate(4deg)}}
.hello .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(6px)}
.hello .btn:hover{background:rgba(255,255,255,.3)}
.hello .btn.white{background:#fff;color:var(--brand);border-color:#fff}

/* ── building blocks ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
.card-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2,.card-h h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.card-h .muted{font-size:12px}
.card-b{padding:16px 20px}
.card-h .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ico{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;font-size:15px;flex:none}
.grid{display:grid;gap:18px}
.grid>*,.g-main>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px 14px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .25s var(--spring),box-shadow .25s}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:var(--tint,var(--surface3));opacity:.8}
.kpi>*{position:relative;z-index:1}
.kpi .kh{display:flex;align-items:center;gap:9px}
.kpi .kh .ico{background:var(--tint,var(--surface3))}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:700}
.kpi .v{font-family:var(--display);font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:9px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:11.5px;color:var(--ink3);margin-top:4px;font-weight:500}
.kpi.k-bad{--tint:var(--pink)} .kpi.k-bad .v{color:var(--bad)}
.kpi.k-ok{--tint:var(--mint)} .kpi.k-ok .v{color:var(--ok)}
.kpi.k-warn{--tint:var(--lemon)} .kpi.k-warn .v{color:var(--warn)}
.kpi.k-brand{--tint:var(--lilac)} .kpi.k-brand .v{color:var(--brand)}
.kpi.click{cursor:pointer} .kpi.click:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(35,30,90,.12)}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:transform .18s var(--spring),background .15s,border-color .15s,box-shadow .2s}
.btn:hover{background:var(--surface2);border-color:var(--ink3);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-p{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(109,74,255,.3);background-size:140% 100%;background-position:0 0}
.btn-p:hover{background:var(--grad);background-size:140% 100%;background-position:100% 0;border-color:transparent;box-shadow:0 10px 22px rgba(109,74,255,.38)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-s{height:30px;padding:0 11px;font-size:12px;border-radius:9px}
.btn-xs{height:26px;padding:0 9px;font-size:11.5px;border-radius:8px}
.btn-ghost{border-color:transparent;background:transparent} .btn-ghost:hover{background:var(--surface3)}
.btn svg{width:15px;height:15px}
.pill,.badge{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--mute-bg);color:var(--ink2)}
.badge{height:20px;padding:0 7px;font-size:11px;background:linear-gradient(135deg,#F43F5E,#E11D48);color:#fff;box-shadow:0 3px 8px rgba(225,29,72,.35);animation:popin .4s var(--spring)}
@keyframes popin{from{transform:scale(.4)}to{transform:none}}
.pill-ok{background:var(--ok-bg);color:var(--ok)} .pill-bad{background:var(--bad-bg);color:var(--bad)} .pill-warn{background:var(--warn-bg);color:var(--warn)}
.pill-orange{background:var(--orange-bg);color:var(--orange)} .pill-violet{background:var(--violet-bg);color:var(--violet)} .pill-info{background:var(--info-bg);color:var(--info)} .pill-mute{background:var(--mute-bg);color:var(--ink3)} .pill-brand{background:var(--brand-bg);color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;cursor:pointer;color:var(--ink2);transition:background .15s}
.chip:hover{background:var(--surface3)}
.chip-btn{height:25px;font-size:11.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block;flex:none}
.dot-ok{background:#10B981;box-shadow:0 0 0 3px rgba(16,185,129,.18)} .dot-err{background:#F43F5E} .dot-busy{background:#F5B014;animation:pulse 1s infinite} .dot-off{background:#A3A8C3}
@keyframes pulse{50%{opacity:.35}}
.seg{display:inline-flex;background:var(--surface3);border-radius:13px;padding:4px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{all:unset;flex:none;padding:6px 12px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 2px 8px rgba(35,30,90,.12)}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=password],input:not([type]),select,textarea{height:38px;border:1px solid var(--line2);border-radius:11px;background:var(--surface);padding:0 11px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
textarea{height:auto;padding:9px 11px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-bg)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand);cursor:pointer}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fld>span{font-size:12px;font-weight:700;color:var(--ink2)}
.fld small{font-size:11.5px;color:var(--ink3)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0 10px;cursor:pointer;font-weight:500}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .fld:has(textarea){grid-column:1/-1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.empty{padding:36px 20px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:4px}
.empty .big{font-size:34px;display:block;margin-bottom:6px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:13px;padding:11px 13px;font-size:12.5px;line-height:1.55;margin:8px 0;font-weight:500}
.infobox{background:var(--sky);color:var(--info);border-radius:13px;padding:11px 13px;font-size:12.5px;line-height:1.55;font-weight:500}
.okbox{background:var(--ok-bg);color:var(--ok);border-radius:13px;padding:11px 13px;font-size:12.5px;font-weight:500}
.badbox{background:var(--bad-bg);color:var(--bad);border-radius:13px;padding:11px 13px;font-size:12.5px;font-weight:500}
.drop{border:2px dashed var(--line2);border-radius:16px;padding:18px;text-align:center;cursor:pointer;background:var(--surface2);transition:.2s var(--ease);margin:6px 0 10px}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-bg);transform:scale(1.01)}
.drop .ftypes{display:flex;gap:6px;justify-content:center;margin-top:8px}
.ftag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px}
.ftag.pdf{background:#FFE4E6;color:#E11D48} .ftag.xls{background:#DCFCE7;color:#15803D}
/* dropdown menu */
.menu-wrap{position:relative;display:inline-block}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shm);padding:6px;min-width:190px;z-index:50;display:none;animation:pop .16s var(--ease)}
.menu.open{display:block}
.menu button{all:unset;display:flex;align-items:center;gap:9px;width:100%;box-sizing:border-box;padding:9px 11px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.menu button:hover{background:var(--brand-bg);color:var(--brand)}

/* ── tables ── */
.tbl-wrap{overflow:auto;max-width:100%}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface2);color:var(--ink3);font-weight:700;font-size:11.5px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1;text-transform:uppercase;letter-spacing:.03em}
.tbl th.sort{cursor:pointer;user-select:none} .tbl th.sort:hover{color:var(--brand)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;transition:background .12s}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--brand-bg) 55%,transparent)}
.tbl .r{text-align:right}
.tbl tr.done td{opacity:.5}
.tbl tr.flash td{animation:flash 1s var(--ease)}
@keyframes flash{0%{background:#D1FAE5}100%{background:transparent}}
.tbl tfoot td{font-weight:800;background:var(--surface2);border-top:1px solid var(--line2)}
.cname{font-weight:700;cursor:pointer;color:var(--ink)} .cname:hover{color:var(--brand);text-decoration:underline;text-underline-offset:3px}
.tbl-scroll{max-height:68vh;overflow:auto}
.amt-bad{color:var(--bad);font-weight:800} .amt-warn{color:var(--warn);font-weight:800} .amt-ok{color:var(--ok);font-weight:800}
.avatar{width:32px;height:32px;border-radius:10px;display:inline-grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex:none}

/* ── today ── */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.runcard{background:linear-gradient(135deg,#4338CA 0%,#6D4AFF 45%,#C026D3 100%);color:#fff;border-radius:22px;padding:20px 22px;position:relative;overflow:hidden;box-shadow:0 16px 40px rgba(109,74,255,.32);transition:transform .3s var(--spring)}
.runcard:hover{transform:translateY(-3px)}
.runcard.mid{background:linear-gradient(135deg,#0E7490 0%,#0EA5E9 50%,#22D3EE 100%);box-shadow:0 16px 40px rgba(14,165,233,.28)}
.runcard::after{content:"";position:absolute;right:-50px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 68%)}
.runcard>*{position:relative;z-index:1}
.runcard .k{font-size:11.5px;color:rgba(255,255,255,.85);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.runcard .d{font-family:var(--display);font-size:25px;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
.runcard .m{font-size:12.5px;color:rgba(255,255,255,.88);font-weight:500}
.runcard .rc-top{display:flex;gap:14px;align-items:center}
.ring{flex:none}
.ring circle{transition:stroke-dashoffset 1.2s var(--ease)}
.runcard .stats{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:rgba(255,255,255,.85);margin-top:14px}
.runcard .stats b{display:block;color:#fff;font-size:16px;font-family:var(--display)}
.runcard .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:#fff}
.runcard .btn:hover{background:rgba(255,255,255,.3)}
.runcard .btn.white{background:#fff;color:#5B21B6;border-color:#fff}
.window-open{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);color:#047857;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:800}
.window-open::before{content:"";width:7px;height:7px;border-radius:50%;background:#10B981;animation:pulse 1.2s infinite}
.window-closed{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);color:#fff;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.cashcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 22px;box-shadow:var(--sh);cursor:pointer;transition:transform .3s var(--spring),box-shadow .3s;position:relative;overflow:hidden}
.cashcard:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(35,30,90,.12)}
.cashcard::before{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:var(--mint);opacity:.9}
.cashcard>*{position:relative}
.cashcard .big{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.02em}
.task{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);transition:background .15s,transform .2s var(--ease)}
.task:hover{background:var(--surface2)}
.task.leaving{animation:leave .45s var(--ease) forwards}
@keyframes leave{to{opacity:0;transform:translateX(40px);height:0;padding:0}}
.task:last-child{border-bottom:none}
.task .t-main{flex:1;min-width:0}
.task .t-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .t-why{font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.5}
.task .t-amt{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
.task .t-acts{display:flex;gap:5px;flex:none}
.rank{width:30px;height:30px;border-radius:10px;background:var(--surface3);display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--ink2);flex:none}
.rank.hot{background:linear-gradient(135deg,#FB7185,#E11D48);color:#fff;box-shadow:0 4px 10px rgba(225,29,72,.3)}
.routine{display:flex;flex-direction:column}
.routine label{display:flex;gap:11px;align-items:flex-start;padding:10px 20px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:500;transition:background .15s}
.routine label:hover{background:var(--surface2)}
.routine label:last-child{border-bottom:none}
.routine label.auto{cursor:default}
.routine .done-t{text-decoration:line-through;color:var(--ink3)}
.xp{height:9px;border-radius:9px;background:var(--surface3);overflow:hidden;margin:0 20px 14px}
.xp>i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width 1s var(--ease)}
.sec-title{font-size:12px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px}

/* ── charts ── */
.fc-chart{display:flex;align-items:flex-end;gap:12px;height:230px;padding:14px 6px 0}
.fc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;cursor:pointer;position:relative}
.fc-bar{width:100%;max-width:68px;display:flex;flex-direction:column-reverse;border-radius:12px 12px 5px 5px;overflow:hidden;background:var(--surface3);min-height:4px;transform-origin:bottom;animation:grow .8s var(--ease) both;transition:filter .2s,transform .2s var(--spring)}
.fc-col:hover .fc-bar{filter:brightness(1.08) saturate(1.1);transform:scaleX(1.06)}
.fc-col.sel .fc-bar{outline:3px solid var(--brand);outline-offset:3px}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.fc-bar i{display:block;width:100%}
.fc-val{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;font-family:var(--display)}
.fc-lbl{font-size:11px;color:var(--ink3);text-align:center;line-height:1.25}
.fc-lbl b{color:var(--ink2);display:block}
.tip{position:fixed;z-index:120;pointer-events:none;background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px;font-size:12px;box-shadow:var(--shm);min-width:170px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip .tr{display:flex;justify-content:space-between;gap:14px} .tip i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.fc-tbl td,.fc-tbl th{text-align:right} .fc-tbl td:first-child,.fc-tbl th:first-child{text-align:left}
.fc-tbl tr.tier td{font-weight:650}
.fc-tbl tr.tot td{font-weight:800;background:var(--lilac)}
.fc-tbl td.z{color:var(--ink3)}
.fc-tbl .hl{background:color-mix(in srgb,var(--brand-bg) 70%,transparent)!important}
.run-tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--brand-bg);color:var(--brand);margin:1px}
.run-tag.MID{background:var(--sky);color:var(--info)}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut path{cursor:pointer;transition:transform .2s var(--spring),opacity .2s;transform-origin:50% 50%}
.donut path:hover{transform:scale(1.05)}
.donut-legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.donut-legend button{all:unset;display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 6px;border-radius:7px}
.donut-legend button:hover{background:var(--surface3)}
.donut-legend i{width:10px;height:10px;border-radius:4px}

/* ── drawer ── */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,96vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shm);z-index:60;transform:translateX(105%);transition:transform .35s var(--ease);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-h{padding:20px 22px;background:var(--grad);color:#fff;display:flex;gap:10px;align-items:flex-start;position:relative;overflow:hidden}
.drawer-h::after{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%)}
.drawer-h>*{position:relative;z-index:1}
.drawer-h h2{margin:0;font-size:19px;font-family:var(--display)}
.drawer-h .muted{color:rgba(255,255,255,.85)}
.drawer-h .pill{background:rgba(255,255,255,.2);color:#fff}
.drawer-b{flex:1;overflow:auto;padding:18px 22px}
.drawer .x{all:unset;cursor:pointer;margin-left:auto;font-size:24px;line-height:1;color:#fff;padding:2px 8px;border-radius:8px}
.drawer .x:hover{background:rgba(255,255,255,.18)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.fact{background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:10px 12px}
.fact:nth-child(1){background:var(--pink)} .fact:nth-child(2){background:var(--sky)} .fact:nth-child(3){background:var(--lemon)} .fact:nth-child(4){background:var(--peach)} .fact:nth-child(5){background:var(--lilac)} .fact:nth-child(6){background:var(--mint)}
.fact .l{font-size:11px;color:var(--ink2);font-weight:700}
.fact .v{font-weight:800;font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums;font-family:var(--display)}
.agebar{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--surface3);margin:6px 0}
.agebar i{transition:width .9s var(--ease)}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:15px}
.timeline .ev{position:relative;padding:4px 0 10px;font-size:12.5px}
.timeline .ev::before{content:"";position:absolute;left:-21px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2.5px solid var(--brand)}
.h4{font-size:12px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}

/* ── modal ── */
.modal-wrap{position:fixed;inset:0;background:rgba(22,18,59,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:flex-start;justify-content:center;z-index:80;padding:6vh 16px 16px;overflow:auto}
.modal-wrap.open{display:flex;animation:fade .2s}
.modal{background:var(--surface);border-radius:22px;box-shadow:var(--shm);width:min(560px,100%);display:flex;flex-direction:column;max-height:88vh;animation:pop .3s var(--spring)}
.modal-wrap.wide .modal{width:min(840px,100%)} .modal-wrap.xwide .modal{width:min(1200px,100%)}
@keyframes pop{from{transform:scale(.94) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;padding:17px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:17px;font-weight:800}
.modal-b{padding:18px 22px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:13px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f:empty{display:none}
.cmp{display:grid;grid-template-columns:370px 1fr;gap:18px}
.cmp-cust{background:var(--grad-soft);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:12px}
.cmp-name{font-weight:800}
.cmp-prev{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;color:#1e293b}
.cmp-subj{padding:11px 15px;border-bottom:1px solid #e2e8f0;background:#f8fafc}
.cmp-subj .muted{color:#64748b}
.cmp-body{padding:4px 2px;max-height:58vh;overflow:auto}
.att-toggle{display:flex;gap:6px;margin:-2px 0 10px}

/* briefing */
.brief{display:flex;flex-direction:column;gap:10px}
.brief-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:13.5px;animation:rise .4s var(--ease) both}
.brief-item:nth-child(2){animation-delay:.06s}.brief-item:nth-child(3){animation-delay:.12s}.brief-item:nth-child(4){animation-delay:.18s}.brief-item:nth-child(5){animation-delay:.24s}
.brief-item .ico{width:36px;height:36px;font-size:18px}
.brief-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brief-head .big{font-size:40px}
.brief-head h2{margin:0;font-family:var(--display);font-size:22px}

/* splash */
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(800px 500px at 50% 30%,#3B2AA8 0%,#16123B 60%,#0B0920 100%);color:#fff;cursor:pointer;transition:opacity .5s var(--ease)}
#splash.out{opacity:0;pointer-events:none}
#splash .sp-mark{width:96px;height:96px;border-radius:28px;background:var(--grad);display:grid;place-items:center;box-shadow:0 20px 60px rgba(192,38,211,.5);animation:spIn .7s var(--spring) both}
#splash .sp-mark svg{animation:spFly 1.6s var(--ease) .3s both}
@keyframes spIn{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spFly{0%{transform:translate(-30px,30px);opacity:0}60%{opacity:1}100%{transform:none}}
#splash .sp-t{font-family:var(--display);font-size:40px;font-weight:800;margin-top:22px;letter-spacing:-.02em;animation:rise .6s var(--ease) .35s both}
#splash .sp-t span{background:linear-gradient(90deg,#FFD666,#F5B014);-webkit-background-clip:text;background-clip:text;color:transparent}
#splash .sp-s{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.7;font-weight:700;margin-top:8px;animation:fade .6s .6s both}
#splash .sp-skip{position:absolute;bottom:22px;right:24px;font-size:11px;letter-spacing:.15em;opacity:.5;text-transform:uppercase}
#splash .trail{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;animation:twinkle 2s infinite alternate}

/* ── toasts ── */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:min(400px,92vw)}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:12px 13px;box-shadow:var(--shm);animation:toastIn .35s var(--spring);font-size:13px}
@keyframes toastIn{from{transform:translateX(30px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.toast.out{opacity:0;transform:translateX(20px);transition:.25s}
.toast-ico{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;color:#fff;background:linear-gradient(135deg,#34D399,#059669)}
.t-err .toast-ico{background:linear-gradient(135deg,#FB7185,#E11D48)} .t-warn .toast-ico{background:linear-gradient(135deg,#FCD34D,#D97706)} .t-info .toast-ico{background:var(--grad)}
.toast-b{flex:1;min-width:0} .toast-t{font-weight:800} .toast-m{color:var(--ink3);font-size:12px;margin-top:1px;word-break:break-word}
.toast-x{all:unset;cursor:pointer;color:var(--ink3);font-size:18px;line-height:1;padding:0 2px}
.toast-undo{all:unset;cursor:pointer;color:var(--brand);font-weight:800;font-size:12px;padding:2px 4px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:150}

/* ── drag overlay ── */
#dropzone{position:fixed;inset:12px;border-radius:28px;background:color-mix(in srgb,var(--brand-bg) 85%,transparent);border:3px dashed var(--brand);z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--brand);backdrop-filter:blur(4px);gap:12px}
#dropzone.on{display:flex;animation:fade .15s}
#dropzone .dz-ico{font-size:52px;animation:fly 1.6s var(--ease) infinite alternate}

/* queries */
.qcard{border:1px solid var(--line);border-radius:16px;padding:13px 15px;background:var(--surface);margin-bottom:10px;transition:transform .2s var(--ease),box-shadow .2s}
.qcard:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.qcard.over{border-left:5px solid var(--bad)} .qcard.warnl{border-left:5px solid var(--warn)}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qbody{font-size:13px;margin-top:6px;color:var(--ink2)}
.qmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:8px;align-items:center}
.qnotes{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px;font-size:12px}

.viewer-banner{background:var(--grad);color:#fff;padding:9px 30px;font-size:12.5px;font-weight:700}

/* responsive */
@media (max-width:1100px){ .g-main,.g3{grid-template-columns:1fr} .g4{grid-template-columns:repeat(2,1fr)} .cmp{grid-template-columns:1fr} }
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;gap:6px;border-right:none;border-bottom:1px solid var(--line)}
  .brand{padding:0 8px 0 0} .brand-sub,.side-foot,.build,.brand-name{display:none}
  .brand-mark{width:34px;height:34px}
  .nav{flex-direction:row} .nav button{padding:8px 10px;white-space:nowrap} .nav button span.lbl{display:none}
  .nav button.on span.lbl{display:inline}
  .top{position:static;padding:12px 16px;flex-wrap:wrap} .search{width:100%;margin-left:0}
  .content{padding:16px 16px 60px}
  .g2,.g4{grid-template-columns:1fr} .facts{grid-template-columns:1fr 1fr} .form-grid,.grid2{grid-template-columns:1fr}
  .task{flex-wrap:wrap} .task .t-acts{width:100%;justify-content:flex-end}
  .hello{padding:18px} .hello h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
@media print{
  .side,.top,.no-print,#toasts,.hello .btn{display:none!important} .app{display:block} .content{padding:0} .card{box-shadow:none;break-inside:avoid} body{background:#fff} body::before{display:none}
}
.anim .kpis>.kpi,.anim .hero>*,.anim .grid>*{animation:rise .5s var(--ease) both}
.anim .kpis>.kpi:nth-child(2),.anim .hero>*:nth-child(2),.anim .grid>*:nth-child(2){animation-delay:.05s}
.anim .kpis>.kpi:nth-child(3),.anim .hero>*:nth-child(3){animation-delay:.1s}
.anim .kpis>.kpi:nth-child(4){animation-delay:.15s} .anim .kpis>.kpi:nth-child(5){animation-delay:.2s} .anim .kpis>.kpi:nth-child(6){animation-delay:.25s} .anim .kpis>.kpi:nth-child(7){animation-delay:.3s} .anim .kpis>.kpi:nth-child(8){animation-delay:.35s}

/* ═══ v3: calm, professional, fits the screen ═══ */
.brand-name{font-weight:700;font-size:19px;letter-spacing:-.01em}
.top h1{font-weight:700;font-size:21px;letter-spacing:-.01em}
.top .sub{font-size:12.5px}
.page-desc{font-size:12.5px;color:var(--ink2);font-weight:500;margin-top:1px}
.nav button{font-size:14px;font-weight:500;padding:10px 12px}
.nav button.on{font-weight:600}
.nav .nav-sec{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;padding:14px 12px 4px}
.kpi{padding:14px 16px 13px;border-top:3px solid var(--line2)}
.kpi::after{display:none}
.kpi .kh{gap:0} .kpi .kh .ico{display:none}
.kpi .l{font-size:11.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}

// STORE — localStorage (fast) + IndexedDB mirror (durable) + Cloudflare sync (cross-device)
// All synced keys keep the historic "nwi_" prefix so existing CreditFlow data carries over.
// ═══════════════════════════════════════════════════════════════════
var SYNC_KEYS = ['nwi_enquiries','nwi_resolved_enq','nwi_sa_customers','nwi_sa_meta','nwi_ar_customers','nwi_ar_meta',
  'nwi_contacts','nwi_chase_log','nwi_ptp','nwi_payments','nwi_snooze','nwi_daily_history','nwi_monthly_sales',
  'nwi_pay_base','nwi_pay_overrides','nwi_run_ticks','nwi_remits','nwi_stmts','nwi_settings','nwi_fc_snaps',
  'nwi_replies','nwi_routine','nwi_milestones','nwi_audit','nwi_sent_ledger','nwi_partners','nwi_calls'];

var DB = {
  _c: {},
  raw: function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  get: function(k, def){
    if(k in this._c) return this._c[k];
    var v=this.raw(k), out=def;
    if(v!=null){ try{ out=JSON.parse(v); }catch(e){ out=v; } }
    if(out===undefined) out=def;
    this._c[k]=out;
    return out;
  },
  set: function(k, val, opts){
    this._c[k]=val; if(typeof FC_GEN!=='undefined') FC_GEN++;
    var s=(typeof val==='string')?val:JSON.stringify(val);
    try{ localStorage.setItem(k,s); }catch(e){ /* quota — IDB still has it */ }
    idbSet(k,s);
    if(SYNC_KEYS.indexOf(k)>=0 && !(opts&&opts.fromCloud)){
      var meta=this.meta(); meta[k]=Date.now(); this._saveMeta(meta);
      Cloud.queue();
    }
  },
  del: function(k){ delete this._c[k]; try{ localStorage.removeItem(k); }catch(e){} idbDel(k); },
  meta: function(){ try{ return JSON.parse(localStorage.getItem('pp_meta')||'{}'); }catch(e){ return {}; } },
  _saveMeta: function(m){ try{ localStorage.setItem('pp_meta', JSON.stringify(m)); }catch(e){} idbSet('pp_meta', JSON.stringify(m)); },
  invalidate: function(){ this._c={}; if(typeof FC_GEN!=='undefined') FC_GEN++; }
};
// another tab of PayPilot changed something → drop our cached copy and redraw
window.addEventListener('storage', function(e){ if(!e.key) { DB.invalidate(); } else if(e.key in DB._c){ delete DB._c[e.key]; } if(e.key && e.key.indexOf('nwi_')===0 && typeof renderAll==='function'){ clearTimeout(DB._st); DB._st=setTimeout(function(){ rebuild(); renderAll(); },300); } });

// ── IndexedDB mirror ──
var _idb=null;
function _idbOpen(){
  return new Promise(function(res){
    if(_idb) return res(_idb);
    try{
      var req=indexedDB.open('creditflow',1); // same DB name → old data is restored
      req.onupgradeneeded=function(e){ e.target.result.createObjectStore('kv'); };
      req.onsuccess=function(e){ _idb=e.target.result; res(_idb); };
      req.onerror=function(){ res(null); };
    }catch(e){ res(null); }
  });
}
function idbSet(k,v){ _idbOpen().then(function(db){ if(!db) return; try{ db.transaction('kv','readwrite').objectStore('kv').put(v,k); }catch(e){} }); }
function idbGet(k){ return _idbOpen().then(function(db){ return new Promise(function(res){ if(!db) return res(null); try{ var r=db.transaction('kv').objectStore('kv').get(k); r.onsuccess=function(){ res(r.result==null?null:r.result); }; r.onerror=function(){ res(null); }; }catch(e){ res(null); } }); }); }
function idbDel(k){ _idbOpen().then(function(db){ if(!db) return; try{ db.transaction('kv','readwrite').objectStore('kv').delete(k); }catch(e){} }); }
function idbKeys(){ return _idbOpen().then(function(db){ return new Promise(function(res){ if(!db) return res([]); try{ var r=db.transaction('kv').objectStore('kv').getAllKeys(); r.onsuccess=function(){ res(r.result||[]); }; r.onerror=function(){ res([]); }; }catch(e){ res([]); } }); }); }
// Restore anything the browser evicted from localStorage (Safari does this)
function idbBootRestore(){
  return idbKeys().then(function(keys){
    var miss=keys.filter(function(k){ k=String(k); return (k.indexOf('nwi_')===0||k==='pp_meta') && localStorage.getItem(k)==null; });
    return Promise.all(miss.map(function(k){ return idbGet(k).then(function(v){ if(v!=null) try{ localStorage.setItem(k,v); }catch(e){} }); })).then(function(){ return miss.length; });
  });
}

// ═══════════════════════════════════════════════════════════════════
// CLOUD SYNC — per-key merge (newest edit of each key wins), so two devices
// never wipe each other's work and an old CreditFlow tab can't erase new data.
// ═══════════════════════════════════════════════════════════════════
var Cloud = {
  timer: null, busy: false, again: false, lastOk: null, state: 'off',
  cfg: function(){ return { url: (devGet('nwi_cloud_url','')||CLOUD_DEFAULT_URL).replace(/\/+$/,''), key: devGet('nwi_cloud_key','') }; },
  ready: function(){ var c=this.cfg(); return !!(c.url&&c.key); },
  // Move devices from the old creditflow-sync address to the paypilot worker once it answers.
  // A live PayPilot worker replies 401 to an unsigned /ping; a missing worker does not.
  resolveUrl: async function(){
    var saved=(devGet('nwi_cloud_url','')||'').replace(/\/+$/,'');
    if(saved && saved!==CLOUD_OLD_URL) return saved;
    var live=async function(u){ try{ var r=await fetch(u+'/ping',{cache:'no-store'}); return r.status===401||r.ok; }catch(e){ return false; } };
    if(await live(CLOUD_DEFAULT_URL)){ devSet('nwi_cloud_url', CLOUD_DEFAULT_URL); return CLOUD_DEFAULT_URL; }
    devSet('nwi_cloud_url', CLOUD_OLD_URL); return CLOUD_OLD_URL;
  },
  weakKey: function(){ var k=this.cfg().key; return !!k && k.length<16; },
  queue: function(){ if(!this.ready()) return; clearTimeout(this.timer); this.timer=setTimeout(function(){ Cloud.sync(false); }, 2500); },
  status: function(st, txt){
    this.state=st;
    var dot=$('sync-dot'); if(dot) dot.className='dot dot-'+st;
    var t=$('sync-txt'); if(t) t.textContent=txt||'';
    var el=$('cloud-status'); if(el){ el.textContent=txt||''; el.className='pill pill-'+(st==='ok'?'ok':st==='err'?'bad':'mute'); }
  },
  sync: async function(manual){
    if(!this.ready()){ this.status('off','Sync off'); if(manual) toast('warn','Cloud sync not set up','Enter your sync key in Settings'); return; }
    if(this.busy){ this.again=true; return; }
    this.busy=true; this.status('busy','Syncing…');
    var c=this.cfg(), changedFromCloud=false;
    try{
      var r=await fetch(c.url+'/data',{headers:{'x-sync-key':c.key}, cache:'no-store'});
      if(r.status===401){ this.status('err','Wrong sync key'); if(manual) toast('err','Wrong sync key','Check the key in Settings matches SYNC_SECRET in Cloudflare'); this.busy=false; return; }
      if(!r.ok) throw new Error('HTTP '+r.status);
      var remote=null; try{ remote=await r.json(); }catch(e){ remote=null; }
      var lmeta=DB.meta(), rmeta=(remote&&remote._meta)||{}, rSaved=remote&&remote._savedAt?Date.parse(remote._savedAt):0;
      var needPush=!remote||!remote._savedAt;
      SYNC_KEYS.forEach(function(k){
        var lv=DB.raw(k), rv=remote?remote[k]:undefined;
        var lt=lmeta[k]||0, rt=rmeta[k]||(rv!=null?rSaved:0);
        if(rv!=null && (lv==null || rt>lt)){
          if(rv!==lv){ try{ localStorage.setItem(k,rv); }catch(e){} idbSet(k,rv); changedFromCloud=true; }
          lmeta[k]=rt||Date.now();
        } else if(lv!=null && (rv==null || lt>rt)){ needPush=true; }
      });

// ═══════════════════════════════════════════════════════════════════

// ── Bucket labels: "Before 30/09/26", "30/09/26..06/10/26", "After 20/10/26", or a single period-start date
var DATE_TOKEN=/(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}|\d{4}-\d{2}-\d{2})/g;

  if(/after|later|over/i.test(s) && ds.length) return {kind:'after', d:ds[ds.length-1]};

// Turn labels into due-date windows {f,t} (YYYY-MM-DD, null = open-ended)

    for(var i=0;i<p.length;i++){

      else if(x.kind==='after'){ f=x.d?addDays(x.d,1):null; }
      else if(x.kind==='range'){ f=x.a; t=x.b; }
      else if(x.kind==='date'){

function saRecord(code, name, cur, buckets, bal){

function saOverdueOf(r, asOf){

    else if(b.f && b.f<t && b.t && b.t>=t){ var span=daysBetween(b.f,b.t)+1, past=daysBetween(b.f,t); s+=b.a*past/span; }

// pdf.js hands the bytes to its worker and empties the buffer it was given, so always give it a copy —
// the original is still needed afterwards (to save the statement and attach it to the email).
function pdfBytes(ab){ var u=ab instanceof Uint8Array?ab:new Uint8Array(ab); return u.slice(0); }
// ── SUMMARY AGING (PDF) ──
async function pdfRows(ab, pageFilter){
  if(typeof pdfjsLib==='undefined') throw new Error('PDF library not loaded — check your connection');
  var pdf=await pdfjsLib.getDocument({data:pdfBytes(ab)}).promise; var pages=[];
  for(var pn=1;pn<=pdf.numPages;pn++){
    if(pageFilter&&!pageFilter(pn)) continue;
    var page=await pdf.getPage(pn), tc=await page.getTextContent();
    var items=tc.items.map(function(it){ return {t:String(it.str).trim(), x:it.transform[4], y:it.transform[5]}; }).filter(function(i){ return i.t; });
    var rows=[];
    items.forEach(function(it){ var row=null; for(var i=0;i<rows.length;i++){ if(Math.abs(rows[i].y-it.y)<=6){ row=rows[i]; break; } } if(!row){ row={y:it.y,items:[]}; rows.push(row); } row.items.push(it); });
    rows.sort(function(a,b){ return b.y-a.y; });
    pages.push({page:pn, rows:rows.map(function(r){ return {y:r.y, cells:r.items.sort(function(a,b){return a.x-b.x;}).map(function(i){return i.t;})}; })});
  }
  return pages;
}
async function pdfText(ab){
  if(typeof pdfjsLib==='undefined') throw new Error('PDF library not loaded');
  var pdf=await pdfjsLib.getDocument({data:pdfBytes(ab)}).promise, out=[];
  for(var i=1;i<=pdf.numPages;i++){
    var p=await pdf.getPage(i), tc=await p.getTextContent();
    // keep line breaks: group by y
    var lines={}; tc.items.forEach(function(it){ var y=Math.round(it.transform[5]/3); (lines[y]=lines[y]||[]).push(it); });
    Object.keys(lines).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){ out.push(lines[y].sort(function(a,b){return a.transform[4]-b.transform[4];}).map(function(i){return i.str;}).join(' ')); });
  }

}
var ACCT_RE=/^[A-Z]{1,8}\d{2,8}$/, CURR_RE=/^(GBP|USD|EUR)$/, NUMTOK=/^-?[\d,]+\.?\d*$/;
function numsAfter(cells){
  var nums=[]; for(var i=0;i<cells.length;i++){ var raw=cells[i]; if(raw==='-'&&i+1<cells.length&&NUMTOK.test(cells[i+1])){ raw='-'+cells[i+1]; i++; } if(NUMTOK.test(raw.replace(/-$/,''))) nums.push(num(raw)); }

}
async function parseSAPdf(file){
  var ab=await readAsArrayBuffer(file); var pages=await pdfRows(ab); var all=[]; pages.forEach(function(p){ all=all.concat(p.rows); });
  // header labels
  var labels=[];
  for(var ri=0;ri<all.length && !labels.length;ri++){
    var cells=all[ri].cells;
    if(cells.some(function(c){ return /^before/i.test(c); })){
      var comb=cells.slice(); for(var j=1;j<=3&&ri+j<all.length;j++){ if(ACCT_RE.test(all[ri+j].cells[0]||'')) break; comb=comb.concat(all[ri+j].cells); }
      var st=comb.findIndex(function(c){ return /^before/i.test(c); });
      for(var k=st;k<comb.length;k++){
        var c=comb[k];
        if(/^before/i.test(c)){ labels.push(DATE_ONE.test(c)?c:(comb[k+1]&&toDate(comb[k+1])?(c+' '+comb[++k]):'Before')); }
        else if(/^after/i.test(c)){ labels.push(comb[k+1]&&toDate(comb[k+1])?(c+' '+comb[++k]):c); }
        else if(/\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}/.test(c) && !/balance/i.test(c)){

          if(comb[k+1]==='..'&&comb[k+2]){ labels.push(c+'..'+comb[k+2]); k+=2; }
          else labels.push(c);
        }
        if(/^balance/i.test(c)) break;
      }
    }
  }
  var out=[];
  for(var r=0;r<all.length;r++){
    var cs=all[r].cells.slice(); var code=cs[0]||''; if(!ACCT_RE.test(code)) continue;
    var ci=cs.findIndex(function(c){ return CURR_RE.test(c); }), skip=0;
    for(var a=1;ci<0&&a<=3&&r+a<all.length;a++){ var nx=all[r+a].cells; if(ACCT_RE.test(nx[0])&&nx[0]!==code) break; cs=cs.concat(nx); ci=cs.findIndex(function(c){ return CURR_RE.test(c); }); if(ci>=0) skip=a; }
    if(ci<0) continue; r+=skip;
    var name=cs.slice(1,ci).filter(function(c){ return !NUMTOK.test(c); }).join(' ').trim();
    var nums=numsAfter(cs.slice(ci+1)); if(nums.length<2) continue;
    var bal=nums[nums.length-1], bvals=nums.slice(0,-1);

  }

  var asOf=today(); var bw=bucketWindows(labels, asOf);
  var rows=out.map(function(o){
    var b=labels.map(function(l,i){ return {l:l, f:bw.windows[i].f, t:bw.windows[i].t, a:round2(o.bvals[i]||0)}; });
    return saRecord(o.code,o.name,o.cur,b,o.bal);
  });

}

// ── AGED RECEIVABLES (Excel) ──
function parseARExcelRows(rows, fileName){
  var hr=findHeaderRow(rows,[/^name$|customer name|^name\b/,/balance/]);
  if(hr<0) throw new Error('Aged Receivables: header row not found (need Name and Balance columns)');
  // merge up to 2 header rows (BC sometimes splits "Credit" / "Limit")
  var H=rows[hr].map(function(x,i){ var a=cellStr(x).toLowerCase(); var up=hr>0?cellStr((rows[hr-1]||[])[i]).toLowerCase():''; return a||up; });
  var iName=colFind(H,['name','customer name']);
  var iNo=colFind(H,['no.','no','customer no.','code'],/not due|note/);
  var iEmail=colFind(H,['e-mail','email']);
  var iCL=colFind(H,['credit limit (lcy)','credit limit','credit']);
  var iTerms=colFind(H,['payment terms code','payment terms','terms']);
  var iCur=colFind(H,['currency code','currency']);
  var iBal=colFind(H,['balance','balance due'],/^before|^after/);
  var iND=colFind(H,['not due','not yet due','current']);
  var iLP=colFind(H,['last payment date','last payment','last paid']);
  var iPhone=colFind(H,['phone no.','phone']);
  var iContact=colFind(H,['contact']);
  var data=[];
  for(var r=hr+1;r<rows.length;r++){
    var row=rows[r]||[]; var nm=cleanName(row[iName]);
    if(!nm||/^total|currency specification|^page\b/i.test(nm)) continue;
    if(!row.some(function(v,ci){ return ci!==iNo && isNumCell(v); })) continue;
    data.push(row);
  }
  if(!data.length) throw new Error('Aged Receivables: no customer rows found');
  iName=bindCol(data,iName,'str'); iBal=bindCol(data,iBal,'num'); if(iND>=0) iND=bindCol(data,iND,'num');
  if(iCL>=0) iCL=bindCol(data,iCL,'num'); if(iEmail>=0) iEmail=bindCol(data,iEmail,'str'); if(iTerms>=0) iTerms=bindCol(data,iTerms,'str');
  if(iLP>=0) iLP=bindCol(data,iLP,'date'); if(iCur>=0) iCur=bindCol(data,iCur,'str');
  // aged period columns = numeric columns after Not Due
  var aged=[]; if(iND>=0){ for(var c=iND+1;c<H.length+3;c++){ if(c===iLP) continue; var hits=0; data.forEach(function(r){ if(isNumCell(r[c])) hits++; }); if(hits/data.length>0.2) aged.push(c); } }
  var agedLabels=aged.map(function(c){ return cellStr(rows[hr][c])||cellStr((rows[hr-1]||[])[c])||('Period '+(aged.indexOf(c)+1)); });
  var asOf=reportDateFromRows(rows,hr)||today();
  var out=data.map(function(row){
    var bal=num(row[iBal]), nd=iND>=0?num(row[iND]):0, cl=iCL>=0?num(row[iCL]):0;
    var lp=iLP>=0?toDate(row[iLP]):null;
    var cur=(iCur>=0?cellStr(row[iCur]):'GBP').toUpperCase(); if(!/^[A-Z]{3}$/.test(cur)) cur='GBP';
    return {code:cellStr(row[iNo]), name:cleanName(row[iName]), email:iEmail>=0?cleanName(row[iEmail]):'',
      creditLimit:cl, paymentTerms:iTerms>=0?cellStr(row[iTerms]).toUpperCase():'', currency:cur,
      balance:round2(bal), notDue:round2(nd), overdue:round2(Math.max(0,bal-nd)), utilization:cl>0?bal/cl*100:0,
      lastPaymentDate: lp?fmtD(lp):'', lastPay: lp?ymd(lp):'',
      phone:iPhone>=0?cellStr(row[iPhone]):'', contact:iContact>=0?cleanName(row[iContact]):'',
      aged: aged.map(function(c,i){ return {l:agedLabels[i], a:round2(num(row[c]))}; })};
  });
  return {rows:out, meta:{file:fileName, at:new Date().toISOString(), asOf:ymd(asOf), kind:'excel', agedLabels:agedLabels}};

// ── AGED RECEIVABLES (PDF — odd pages = figures, even pages = last payment dates) ──
async function parseARPdf(file){
  var ab=await readAsArrayBuffer(file);
  var odd=await pdfRows(ab,function(p){ return p%2===1; }), even=await pdfRows(ab,function(p){ return p%2===0; });
  var DRE=/^\d{2}-\d{2}-\d{4}$/, HDR=/^(Before|Total|Page|Aged|Currency|Balance|Credit|No\.|Name)$/i;
  var evenDates=even.map(function(p){ return p.rows.map(function(r){ return r.cells; }).filter(function(c){ return c.length&&!HDR.test(c[0]||'')&&c.some(function(x){ return NUMTOK.test(x)||DRE.test(x); }); }).map(function(c){ for(var i=c.length-1;i>=0;i--) if(DRE.test(c[i])) return c[i]; return ''; }); });
  var TERMS=/^(ADV|\d+\s?DAYS?|1\s?DAY|\d+DAY)$/i, out=[];
  odd.forEach(function(pg,pgi){
    var rows=pg.rows, idx=0;
    for(var r=0;r<rows.length;r++){
      var cs=rows[r].cells.slice(), code=cs[0]||''; if(!ACCT_RE.test(code)) continue;
      var ci=cs.findIndex(function(c){ return CURR_RE.test(c); }), skip=0;
      for(var a=1;ci<0&&a<=4&&r+a<rows.length;a++){ var nx=rows[r+a].cells; if(ACCT_RE.test(nx[0])&&nx[0]!==code) break; cs=cs.concat(nx); ci=cs.findIndex(function(c){ return CURR_RE.test(c); }); if(ci>=0) skip=a; }
      if(ci<0) continue; r+=skip;
      var before=cs.slice(0,ci), nums=numsAfter(cs.slice(ci+1)); if(nums.length<2) continue;
      var ti=-1; for(var i=before.length-1;i>=0;i--) if(TERMS.test(before[i])){ ti=i; break; }
      var terms=ti>=0?before[ti].toUpperCase().replace(/\s+/g,''):'';
      var cl=0; if(ti>=1){ for(var j=ti-1;j>=Math.max(0,ti-2);j--){ var n=num(before[j]); if(n>=0&&NUMTOK.test(before[j])){ cl=n; break; } } }
      var ei=before.findIndex(function(c){ return c.indexOf('@')>=0; });
      var nameEnd=ei>0?ei:(ti>=1?ti-1:ti);
      var name=before.slice(1,Math.max(1,nameEnd)).filter(function(c){ return c.indexOf('@')<0; }).join(' ').trim()||before[1]||code;
      var lpRaw=(evenDates[pgi]||[])[idx]||''; idx++;
      var lp=toDate(lpRaw);
      out.push({code:code, name:cleanName(name), email:before.filter(function(c){ return c.indexOf('@')>=0; }).join('; '), currency:cs[ci],
        creditLimit:cl, paymentTerms:terms, balance:round2(nums[0]), notDue:round2(nums[1]), overdue:round2(Math.max(0,nums[0]-nums[1])),
        utilization:cl>0?nums[0]/cl*100:0, lastPaymentDate:lp?fmtD(lp):'', lastPay:lp?ymd(lp):'', aged:nums.slice(2).map(function(v,i){ return {l:'Period '+(i+1), a:v}; })});
    }
  });
  if(!out.length) throw new Error('Aged Receivables PDF: no customer rows found');
  return {rows:out, meta:{file:file.name, at:new Date().toISOString(), asOf:ymd(today()), kind:'pdf'}};
}

// ── CUSTOMER STATEMENT — parsing lives in 41-statement.js ──
// Which customer is a statement for? Account code wins; names are matched outside our own letterhead.
function statementCandidates(text, fileName){
  var own=/NEW WAY|NEWWAY/;
  var hay=' '+normName(text+' '+(fileName||'').replace(/\.[a-z]+$/i,'').replace(/[_\-]+/g,' '))+' ';
  var out=[];
  CUSTS.forEach(function(c){
    var sc=0;
    var code=(c.code||'').replace(/[^A-Z0-9]/gi,'');
    if(code.length>=4 && new RegExp('(^|[^A-Z0-9])'+code+'($|[^A-Z0-9])','i').test(text+' '+(fileName||''))) sc=1000+code.length;
    var n=normName(c.name);
    if(!sc && n.length>=5 && hay.indexOf(' '+n+' ')>=0 && !(own.test(n) && !c.partner)) sc=n.length*(c.partner?0.5:1);
    if(sc) out.push({c:c, s:sc});
  });
  return out.sort(function(a,b){ return b.s-a.s; });
}
function guessCustomerFromText(text, fileName){
  var cand=statementCandidates(text, fileName); if(!cand.length) return null;
  if(cand[0].s>=1000) return cand[0].c;           // customer number printed on the statement
  if(cand.length===1) return cand[0].c;
  if(cand[0].s>=cand[1].s*1.5) return cand[0].c;  // clearly the longest name
  return null;                                    // ambiguous: ask
}
function saveStatement(cust, parsed, fileName){

  DB.set('nwi_stmts', all);

}

function statementFileFor(name){ return idbGet('stmt_'+name).then(function(v){ if(!v) return null; try{ return JSON.parse(v); }catch(e){ return null; } }); }

// ── IMPORT ENTRY POINTS ──

// Detect which report a file is from its header row
async function detectLedgerKind(file){

  var rows=await sheetRows(file); var head=rows.slice(0,40).map(function(r){ return r.map(cellStr).join(' '); }).join(' ').toLowerCase();
  if(/payment types|mid & end month/.test(head)||/latest payment date/.test(head)) return 'terms';

    }

// ── 41-statement.js ──
// ═══════════════════════════════════════════════════════════════════
// CUSTOMER STATEMENTS — read every line of a PDF or Excel statement.
//   • finds the column headings (one or two lines, repeated on every page or only the first)
//   • places every number, date and word under the heading it sits beneath
//   • joins wrapped lines, keeps credits/payments as minus, skips totals and the aging box
//   • compares what it read with the total printed on the statement and lists anything it skipped
// Output items: {doc, ext, type, inv, due, amt, orig, desc, page}
// ═══════════════════════════════════════════════════════════════════
var ST_TYPES=[
  [/^(balance\s*)?(b\/f|bfwd|brought\s*f(or)?w(ar)?d)|opening\s*balance/i,'Brought forward'],
  [/credit\s*(memo|note)|^(sales\s*)?cr(edit)?\.?\s*(memo|note|n)?$|^c\/?n$|^scm$/i,'Credit Memo'],
  [/payment|receipt|remittance|^pmt$|^pay$|^rct$|^bacs$|cash\s*rec/i,'Payment'],
  [/refund/i,'Refund'],
  [/finance\s*charge|interest/i,'Finance Charge'],
  [/reminder/i,'Reminder'],
  [/journal|adjust|write.?off|^jnl$|discount/i,'Adjustment'],
  [/invoice|^inv\.?$|^si$|^sales$/i,'Invoice']

function stType(s){ s=String(s||'').trim(); if(!s) return ''; for(var i=0;i<ST_TYPES.length;i++) if(ST_TYPES[i][0].test(s)) return ST_TYPES[i][1]; return ''; }
function stIsCredit(t){ return t==='Credit Memo'||t==='Payment'; }
// keep the old name working for anything that still calls it
function isCreditDoc(t){ return stIsCredit(stType(t)) || /credit\s*(memo|note)|payment/i.test(t||''); }

var ST_DATE=/^(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}|\d{4}-\d{1,2}-\d{1,2}|\d{1,2}[\-\s]?[A-Za-z]{3,9}\.?[\-\s,]?\d{2,4})$/;
var ST_MON=/^[A-Za-z]{3,9}\.?,?$/;
function stAmt(s){
  // returns a number, or null when s is not an amount
  if(s==null) return null; if(typeof s==='number') return isFinite(s)?s:null;
  var t=String(s).trim().replace(/[–−]/g,'-').replace(/\s+/g,'');
  if(!t) return null;
  var neg=false, m;
  if((m=t.match(/^(.*?)(CR|DR)$/i))){ t=m[1]; if(/CR/i.test(m[2])) neg=true; }
  t=t.replace(/^(GBP|EUR|USD)/i,'').replace(/(GBP|EUR|USD)$/i,'');
  if(/^-?\(.*\)$/.test(t)){ neg=true; t=t.replace(/[()]/g,''); }
  if(/^-/.test(t)){ neg=true; t=t.slice(1); }
  if(/-$/.test(t)){ neg=true; t=t.slice(0,-1); }
  var cur=/^[£$€]/.test(t); t=t.replace(/^[£$€]/,''); if(/^-/.test(t)){ neg=true; t=t.slice(1); }
  if(!/^\d{1,3}(,\d{3})*(\.\d{1,2})?$|^\d+(\.\d{1,2})?$/.test(t)) return null;
  // a bare integer with no separators is only an amount if it carries a £ sign (it is usually a number of some sort)
  if(!/[.,]/.test(t) && !cur) return null;
  var n=parseFloat(t.replace(/,/g,'')); if(isNaN(n)) return null;
  return neg?-n:n;
}
function stIsDoc(s){

// no headings anywhere: one record per line that has a reference, a date and an amount
function stPdfFallback(lines){
  var items=[], skipped=[], rows=[];
  lines.forEach(function(L){
    var toks=L.toks.map(function(t){ return Object.assign({k:stKindOf(t)},t); });
    var amts=toks.filter(function(t){ return t.k==='amt'; }).map(function(t){ return stAmt(t.t); });
    var dts=toks.filter(function(t){ return t.k==='date'; }).map(function(t){ return toDate(t.t); });
    var doc=toks.find(function(t){ return t.k!=='date' && t.k!=='amt' && stIsDoc(t.t); });
    if(!amts.length) return;
    if(!doc || !dts.length){ if(ST_TOTAL.test(L.text)||ST_AGING.test(L.text)) return; if(doc||dts.length) skipped.push({page:L.page, text:L.text, reason:'line not complete'}); return; }
    var words=toks.filter(function(t){ return t.k==='text' && t!==doc; }).map(function(t){ return t.t; });
    rows.push({L:L, amts:amts, dts:dts, doc:doc.t, words:words});
  });
  // is the last number a running balance? (each line's last = previous last + this line's amount)
  var run=0, tests=0; for(var i=1;i<rows.length;i++){ var a=rows[i].amts, p=rows[i-1].amts; if(a.length>=2 && p.length>=1){ tests++; if(Math.abs(p[p.length-1]+a[a.length-2]-a[a.length-1])<0.02) run++; } }
  var hasRun=tests>=2 && run/tests>0.6;
  rows.forEach(function(r){
    var exti=r.words.findIndex(function(w){ return /^(CP|PO)[A-Z0-9\-]*\d+$|^0\d{4,}$/i.test(w); });
    var ext=exti>=0?r.words.splice(exti,1)[0]:'';
    var typeTxt=r.words.join(' '), type=stType(typeTxt)||'';
    var amt=hasRun&&r.amts.length>=2?r.amts[r.amts.length-2]:r.amts[r.amts.length-1];
    if(!type) type=amt<0?'Credit':'Invoice';
    if(stIsCredit(type)) amt=-Math.abs(amt);
    items.push({doc:r.doc, ext:ext, type:type, inv:r.dts.length>1?ymd(r.dts[0]):'', due:ymd(r.dts[r.dts.length-1]), amt:round2(amt), orig:r.amts.length>1&&!hasRun?round2(r.amts[0]):null, bal:hasRun?round2(r.amts[r.amts.length-1]):null, desc:typeTxt.replace(/\b(invoice|credit memo|payment)\b/ig,'').trim(), page:r.L.page});

function stDedupe(items, skipped){
  var seen={}, out=[];

    if(k && seen[k] && it.page!==seen[k].page){ skipped.push({page:it.page, text:it.doc+' '+it.amt, reason:'repeated on another page — counted once'}); return; }
    if(k) seen[k]=it; out.push(it);
  });
  return out;
}

// ── Excel / CSV: every sheet, every heading block ──
function stRowIsHeader(cells){
  var s=cells.map(function(x){ return cellStr(x); }).filter(Boolean);
  if(s.length<3) return false;
  if(cells.some(function(x){ return typeof x==='number' || x instanceof Date; })) return false;
  var kinds=s.map(stColKind);
  var n=kinds.filter(Boolean).length;
  return n>=3 && kinds.some(function(k){ return ST_AMTK[k]; }) && kinds.some(function(k){ return k==='doc'||k==='post'||k==='due'||k==='desc'; });
}
function parseStatementRows(rows, sheetName, acc){
  acc=acc||{items:[], totals:[], skipped:[], headers:[]};
  var blocks=[];
  for(var i=0;i<rows.length;i++){ if(stRowIsHeader(rows[i]||[])) blocks.push(i); }
  if(!blocks.length) return acc;
  blocks.forEach(function(hr, bi){
    var end=bi<blocks.length-1?blocks[bi+1]:rows.length;
    var H=(rows[hr]||[]).map(function(x){ return cellStr(x); });
    // two-line headings ("Remaining" / "Amount")
    var start=hr+1, nx=rows[hr+1]||[];
    if(nx.length && !nx.some(function(x){ return typeof x==='number'||x instanceof Date; }) && nx.filter(function(x){ return cellStr(x); }).length>=2 && nx.every(function(x){ var s=cellStr(x); return !s || s.split(/\s+/).every(function(w){ return ST_HWORDS.test(w); }); })){
      H=H.map(function(h,ci){ var b=cellStr(nx[ci]); return (h+' '+b).trim(); }); for(var ci=H.length;ci<nx.length;ci++) H[ci]=cellStr(nx[ci]); start=hr+2;
    }
    var kinds=H.map(stColKind);
    var col={}; kinds.forEach(function(k,ci){ if(k && col[k]==null) col[k]=ci; });
    // second doc column = customer reference; two orig columns with no remaining: right-most is open
    var docIdx=kinds.map(function(k,ci){ return k==='doc'?ci:-1; }).filter(function(x){ return x>=0; }); if(docIdx.length>1 && col.ext==null) col.ext=docIdx[1];
    var origIdx=kinds.map(function(k,ci){ return k==='orig'?ci:-1; }).filter(function(x){ return x>=0; }); if(origIdx.length>1 && col.rem==null){ col.rem=origIdx[origIdx.length-1]; col.orig=origIdx[0]; }
    var postIdx=kinds.map(function(k,ci){ return k==='post'?ci:-1; }).filter(function(x){ return x>=0; }); if(postIdx.length>1 && col.due==null) col.due=postIdx[postIdx.length-1];
    var data=rows.slice(start,end);
    // merged headings: data can sit one column to the side — but only ever move into a column with no heading of its own
    var bindTo=function(ci, kind){
      var test=kind==='num'?function(v){ return typeof v==='number'||stAmt(v)!=null; }:function(v){ return !!toDate(v); };
      var hits=function(c){ var n=0; data.forEach(function(r){ if(r&&test(r[c])) n++; }); return n; };
      if(hits(ci)>0) return ci;
      var cands=[ci+1,ci-1,ci+2,ci-2]; for(var i=0;i<cands.length;i++){ var c=cands[i]; if(c>=0 && !H[c] && hits(c)>0) return c; }
      return ci;
    };
    ['rem','orig','debit','credit','bal'].forEach(function(k){ if(col[k]!=null) col[k]=bindTo(col[k],'num'); });
    ['post','due'].forEach(function(k){ if(col[k]!=null) col[k]=bindTo(col[k],'date'); });
    acc.headers.push((sheetName?sheetName+': ':'')+H.filter(Boolean).map(function(h,ci){ return h; }).join(' | '));
    var prev=null;
    data.forEach(function(row, ri){
      row=row||[]; var vals=row.map(cellStr); if(!vals.some(Boolean)){ prev=null; return; }
      var line=vals.filter(Boolean).join(' · ');
      var g=function(k){ return col[k]!=null?row[col[k]]:''; };
      var numOf=function(k){ if(col[k]==null) return null; var v=row[col[k]]; if(v===''||v==null) return null; var a=typeof v==='number'?v:stAmt(v); return a==null?null:a; };
      var nums={}; ['rem','orig','debit','credit','bal'].forEach(function(k){ var v=numOf(k); if(v!=null) nums[k]=v; });
      var doc=cellStr(g('doc')), dPost=toDate(g('post')), dDue=toDate(g('due'));
      var anyNum=Object.keys(nums).length>0;
      var textAll=vals.join(' ');
      if(!doc && !dPost && !dDue && ST_TOTAL.test(textAll)){
        if(anyNum && !ST_NOT_TOTAL.test(textAll)) acc.totals.push({label:vals.filter(function(v){ return v && stAmt(v)==null; }).join(' ').slice(0,40), v:nums.rem!=null?nums.rem:nums.bal!=null?nums.bal:nums.orig!=null?nums.orig:(nums.debit||0)-(nums.credit||0)});
        else if(anyNum) acc.skipped.push({page:sheetName, text:line, reason:'summary line'});
        prev=null; return;
      }
      if(!anyNum){
        // a wrapped description under the row above
        if(prev && !doc && !dPost){ var extra=[cellStr(g('desc')),cellStr(g('ext')),cellStr(g('type'))].filter(Boolean).join(' '); if(extra){ prev.desc=(prev.desc?prev.desc+' ':'')+extra; return; } }
        if(doc||dPost) acc.skipped.push({page:sheetName, text:line, reason:'no amount on this row'});
        return;
      }
      if(!doc && !dPost && !dDue){ if(ST_AGING.test(textAll)) acc.skipped.push({page:sheetName, text:line, reason:'aging summary'}); else acc.skipped.push({page:sheetName, text:line, reason:'amount without a document number or date'}); return; }
      var it=stFinish({cells:{doc:doc, ext:cellStr(g('ext')), type:cellStr(g('type')), desc:cellStr(g('desc'))}, nums:nums, dates:{post:dPost, due:dDue}, page:sheetName, hasDueCol:col.due!=null});
      if(it){ if(it.amt===0 && col.rem!=null && nums.rem===0){ acc.skipped.push({page:sheetName, text:line, reason:'fully paid (nothing open)'}); return; } acc.items.push(it); prev=it; }
      else acc.skipped.push({page:sheetName, text:line, reason:'no amount found'});
    });
  });
  return acc;
}
function parseStatementWorkbook(wb){
  var acc={items:[], totals:[], skipped:[], headers:[]}, sheets=0;
  wb.SheetNames.forEach(function(sn){
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:true});

  if(!items.length) throw new Error('Statement: no open items found under the headings '+acc.headers[0]);

}
async function parseStatementFile(file){
  var ab=await readAsArrayBuffer(file);
  var isX=/\.(xlsx|xlsm|xls|csv|ods)$/i.test(file.name);
  var res, text='';
  if(isX){
    if(typeof XLSX==='undefined') throw new Error('Excel library not loaded — check your connection');
    // CSV: keep the text as written so 01/07/26 is read the UK way (1 July), not as a US date
    var wb=/\.csv$/i.test(file.name)?XLSX.read(new Uint8Array(ab),{type:'array',raw:true}):XLSX.read(new Uint8Array(ab),{type:'array',cellDates:true});
    res=parseStatementWorkbook(wb);
    try{ text=wb.SheetNames.slice(0,2).map(function(sn){ return XLSX.utils.sheet_to_csv(wb.Sheets[sn]); }).join('\n').slice(0,4000); }catch(e){}
  } else {
    res=await parseStatementPdf(ab);
    try{ text=(await pdfText(ab)).slice(0,4000); }catch(e){}

  return {items:res.items, report:res.report, ab:ab, text:text, mime:isX?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/pdf'};
}
// plain-English one-liner for toasts and the composer
function stmtSummary(rep){
  if(!rep) return '';
  var s=rep.lines+' line'+(rep.lines===1?'':'s')+' read: '+rep.invoices+' invoice'+(rep.invoices===1?'':'s')+(rep.credits?', '+rep.credits+' credit'+(rep.credits===1?'':'s'):'')+(rep.payments?', '+rep.payments+' payment'+(rep.payments===1?'':'s')+' on account':'')+' · open total '+money(rep.total);
  if(rep.printedTotal!=null) s+=rep.mismatch?' · statement says '+money(rep.printedTotal)+' — check':' · matches the statement total';
  if(rep.skippedCount) s+=' · '+rep.skippedCount+' line'+(rep.skippedCount===1?'':'s')+' not used';

}

// ── 55-forecast.js ──
// ═══════════════════════════════════════════════════════════════════

    var acc=s.w1>0? Math.max(0, 100-Math.abs(actual-s.w1)/s.w1*100) : null;
    return {wk:s.wk, forecast:s.w1, actual:round2(actual), acc:acc==null?null:Math.round(acc)};
  });
}

// ═══════════════════════════════════════════════════════════════════
// QUERIES (enquiries / disputes) — treated as blocked cash.
// Same storage key as CreditFlow (nwi_enquiries); new fields are added on the fly.
// SLA: acknowledge in 1 working day · resolve in 5 · escalate at 10
// ═══════════════════════════════════════════════════════════════════
var Q_CATS = {dispute:'Dispute', pricing:'Price difference', po_mismatch:'PO mismatch', delivery:'Short / damaged delivery', pod:'POD required',
  portal:'Portal / not received', duplicate:'Duplicate', returns:'Return / RMA', credit_note:'Credit note due', payment_plan:'Payment plan', other:'Other'};
var Q_STATUS = {new:'New', ack:'Acknowledged', wait_cust:'Waiting on customer', wait_int:'Waiting internal', resolved:'Resolved'};
var Q_OWNERS = {me:'Me', sales:'Sales', warehouse:'Warehouse', customer:'Customer', manager:'Manager'};
var Q_SLA = {ack:1, resolve:5, escalate:10};

function queries(){ var a=DB.get('nwi_enquiries',[]); return Array.isArray(a)?a:[]; }
function saveQueries(a){ DB.set('nwi_enquiries',a); }
function qCreated(q){ return (q.created&&new Date(q.created)) || toDate(q.loggedAt) || (q.id&&q.id>1e12?new Date(q.id):today()); }
function qAgeWD(q){ return workingDaysBetween(qCreated(q), today()); }
function qStatus(q){ return q.status||'new'; }
function qInvoices(q){ return String(q.invoices||'').split(/[,;\s]+/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length>=4; }); }
function qAmount(q, c){
  var a=num(q.amount); if(a) return Math.abs(a);
  // no amount typed → value the listed invoices from the customer's statement
  if(c && c.stmt && c.stmt.items){ var inv=qInvoices(q).map(function(x){return x.toLowerCase();});
    if(inv.length) return round2(sum(c.stmt.items.filter(function(it){ return inv.indexOf(String(it.doc).toLowerCase())>=0 || (it.ext&&inv.indexOf(String(it.ext).toLowerCase())>=0); }),function(it){ return Math.max(0,it.amt); })); }
  return 0;
}
function qSla(q){
  if(qStatus(q)==='resolved') return {cls:'ok', txt:'Resolved'};
  var age=qAgeWD(q);
  if(age>=Q_SLA.escalate) return {cls:'bad', txt:'Escalate · '+age+' wd', esc:true};
  if(age>Q_SLA.resolve) return {cls:'bad', txt:'Over SLA · '+age+' wd'};
  if(qStatus(q)==='new' && age>=Q_SLA.ack) return {cls:'warn', txt:'Acknowledge'};
  return {cls:age>=3?'warn':'mute', txt:age+' wd old'};
}
function qActionDue(q){ var d=fromYMD(q.nextActionDate)||toDate(q.nextActionDate); return d && d<=today() && qStatus(q)!=='resolved'; }
function attachQueries(){
  CUSTS.forEach(function(c){ c.queries=[]; c.queryAmt=0; c.queryUnvalued=0; });
  queries().forEach(function(q){
    if(qStatus(q)==='resolved') return;
    var c=custByName(q.customer); q._c=c?c.name:null;
    if(!c) return;
    c.queries.push(q);
    var a=qAmount(q,c); if(a) c.queryAmt=round2(c.queryAmt+a); else c.queryUnvalued++;
  });
}
function queryInvoiceSet(c){ var s={}; (c.queries||[]).forEach(function(q){ qInvoices(q).forEach(function(i){ s[i.toLowerCase()]=1; }); }); return s; }
function addQuery(data){
  var a=queries();
  var q=Object.assign({id:Date.now(), created:new Date().toISOString(), loggedAt:fmtD(today()), status:'new', owner:'me', priority:'med', category:'other', notes:[]}, data);
  a.unshift(q); saveQueries(a); audit('Query logged', q.customer+' '+(q.invoices||''));
  return q;
}
function updateQuery(id, patch, note){
  var a=queries(); var q=a.find(function(x){ return String(x.id)===String(id); }); if(!q) return null;
  var before=qStatus(q);
  Object.assign(q, patch, {updatedAt:new Date().toISOString()});
  if(patch.status && patch.status!=='new' && !q.ackAt) q.ackAt=new Date().toISOString();
  if(note){ q.notes=q.notes||[]; q.notes.unshift({at:new Date().toISOString(), text:note}); if(!q.ackAt) q.ackAt=new Date().toISOString(); }
  if(patch.status==='resolved' && before!=='resolved'){
    q.resolvedAt=new Date().toISOString();
    var r=DB.get('nwi_resolved_enq',[]); if(!Array.isArray(r)) r=[];
    r.push({customer:q.customer, category:q.category||'', amount:num(q.amount), resolvedAt:ymd(today()), loggedAt:q.loggedAt||'', days:qAgeWD(q)});
    if(r.length>600) r.splice(0,r.length-600);
    DB.set('nwi_resolved_enq',r);
  }
  saveQueries(a); audit('Query updated', q.customer+' → '+(patch.status||'edit'));
  return q;
}
function deleteQuery(id){ saveQueries(queries().filter(function(q){ return String(q.id)!==String(id); })); }

// CHASE EMAIL — Pavi's standard template (Settings → Email template to change)
// Subject: Reminder: Overdue Invoice
// Table: overdue (red) + becoming due by the run date (amber); queried invoices flagged (orange)
// ═══════════════════════════════════════════════════════════════════
var EM=null;
function emailRows(c, run, inclBecoming, scope){
  var t=today(), rd=run?run.date:addDays(t,7), qs=queryInvoiceSet(c);
  tranches(c);
  if(hasStatement(c)){
    var rows=[], all=scope==='all';
    c.stmt.items.forEach(function(it){
      var d=stmtDue(it,c);
      var q=!!(qs[String(it.doc).toLowerCase()]||(it.ext&&qs[String(it.ext).toLowerCase()]));
      if(it.amt<=0){ if(all) rows.push({doc:it.doc, ext:it.ext, type:it.type||'Credit', due:d, amt:it.amt, st:'credit', q:q}); return; }
      var st = !d||d<t ? 'overdue' : (d<=rd ? 'becoming' : 'later');
      if(!all && (st==='later' || (st==='becoming' && !inclBecoming))) return;
      rows.push({doc:it.doc, ext:it.ext, type:it.type, due:d, amt:it.amt, st:st, q:q});
    });
    var ord={overdue:0, becoming:1, later:2, credit:3};
    rows.sort(function(a,b){ return all?((ord[a.st]-ord[b.st])||((a.due||0)-(b.due||0))):((a.due||0)-(b.due||0)); });
    var credits=round2(-sum(c.stmt.items.filter(function(i){ return i.amt<0; }),function(i){ return i.amt; }));
    return {kind:'invoices', rows:rows, credits:credits, all:all, balance:stmtTotal(c)};
  }
  // no statement → aging periods
  var rows2=[];
  if(c.sa && c.sa.buckets){
    c.sa.buckets.forEach(function(b){
      if(!b.a) return;
      var f=fromYMD(b.f), to=fromYMD(b.t);
      var st;
      if(to && to<t) st='overdue';
      else if(!f && !to) st='later';
      else if(f && !to) st='later';              // "After" bucket — not due before the run
      else st = (to<=rd || (f && f<=rd)) ? 'becoming' : 'later';
      if(st==='later' || (st==='becoming'&&!inclBecoming)) return;
      var lbl = !f&&to ? 'Due on or before '+fmtD(to) : (f&&!to ? 'Due from '+fmtD(f) : fmtD(f)+' – '+fmtD(to));
      rows2.push({doc:lbl, ext:'', type:'Aging period', due:to||f, amt:b.a, st:st, q:false, period:true});
    });
  } else if(c.ar){
    if(c.overdue>0) rows2.push({doc:'Overdue balance', type:'Ledger', due:null, amt:c.overdue, st:'overdue', period:true});
  }
  return {kind:'periods', rows:rows2, credits:0};
}
