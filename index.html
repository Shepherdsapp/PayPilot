// ── 70-remits.js ──
// ═══════════════════════════════════════════════════════════════════
// REMITTANCES — read remittance advices (Gmail "Remits" label or uploaded files),
// work out WHO paid, WHEN the money lands and HOW MUCH, and match them to customers.
// Dates are read UK-first (dd/mm/yyyy); US order is only used when the UK reading is
// impossible or when it lands far from the date the email arrived.
// ═══════════════════════════════════════════════════════════════════
function remits(){ var a=DB.get('nwi_remits',[]); return Array.isArray(a)?a:[]; }
function saveRemits(a){ if(a.length>800) a.length=800; DB.set('nwi_remits',a); }

var PAYDATE_KW=/(payment\s*date|value\s*date|pay(?:ment)?\s*run\s*date|date\s*paid|paid\s*on|date\s*of\s*payment|remittance\s*date|transfer\s*date|settlement\s*date|execution\s*date|process(?:ing)?\s*date|payment\s*will\s*be\s*made\s*on|will\s*be\s*paid\s*on|due\s*to\s*arrive|funds\s*will|bacs\s*date|credit\s*date|zahlungsdatum|date\s*de\s*paiement|datum\s*betaling|valuta)/i;
var INVDATE_KW=/(invoice\s*date|inv\.?\s*date|document\s*date|doc\.?\s*date|due\s*date|posting\s*date|your\s*date|date\s*of\s*invoice|period)/i;
var DATE_ANY=/\b(\d{4}-\d{2}-\d{2}|\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}|\d{1,2}(?:st|nd|rd|th)?[\s\-\.]+[A-Za-zÀ-ÿ]{3,9}\.?[\s\-\.,]+\d{2,4}|[A-Za-z]{3,9}\.?\s+\d{1,2}(?:st|nd|rd|th)?,?\s+\d{4})\b/g;

// Both readings of an ambiguous numeric date
function dateReadings(tok){
  var m=tok.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if(!m) { var d=toDate(tok); return d?[{d:d, how:'text'}]:[]; }
  var a=+m[1], b=+m[2], y=+m[3], out=[];
  var uk=validYMD(y,b,a), us=validYMD(y,a,b);
  if(uk) out.push({d:uk, how:'uk'});
  if(us && (!uk || ymd(us)!==ymd(uk))) out.push({d:us, how:'us'});
  return out;
}
function pickPayDate(text, received){
  received=toDate(received)||today();
  var cands=[], m; DATE_ANY.lastIndex=0;
  while((m=DATE_ANY.exec(text))){
    var tok=m[1], pos=m.index;
    var before=text.slice(Math.max(0,pos-70), pos), after=text.slice(pos+tok.length, pos+tok.length+12);
    var kwPay=PAYDATE_KW.test(before), kwInv=INVDATE_KW.test(before.slice(-35));
    // keyword must be the nearest label: ignore if an invoice-date label sits closer
    if(kwPay && kwInv){ var ip=before.search(INVDATE_KW), pp=before.search(PAYDATE_KW); if(ip>pp) kwPay=false; else kwInv=false; }
    dateReadings(tok).forEach(function(r){
      var dist=daysBetween(received, r.d);
      var sc=0;
      if(kwPay) sc+=50; if(kwInv) sc-=40;
      if(dist>=-10 && dist<=21) sc+=20; else if(dist>=-45 && dist<=45) sc+=5; else sc-=30;
      if(r.how==='us') sc-=8; // UK first
      sc-=Math.abs(dist)*0.15;
      cands.push({d:r.d, sc:sc, snip:(before.slice(-40)+tok).replace(/\s+/g,' ').trim(), how:r.how, kw:kwPay});
    });
  }
  cands.sort(function(a,b){ return b.sc-a.sc; });
  var best=cands[0];
  if(best && best.sc>0) return {date:best.d, src:best.kw?('“'+best.snip+'”'):'date found in remittance: '+fmtD(best.d), how:best.how};
  return {date:received, src:'no payment date in the remittance — using the date the email arrived', how:'email'};
}
var MONEY_RE=/(?:(GBP|EUR|USD|£|€|\$)\s?)?(?<![\d.\/\-,])(-?\d{1,3}(?:,\d{3})+(?:\.\d{2})?|-?\d+\.\d{2}|-?\d{1,3}(?:\.\d{3})+,\d{2}|-?\d+,\d{2})(?!\d|[.\/\-]\d)(?:\s?(GBP|EUR|USD|€))?/g;
var AMOUNT_KW=/(total\s*(?:amount\s*)?(?:paid|payment|remitted|remittance)?|payment\s*amount|amount\s*paid|net\s*(?:payment|amount)|sum\s*paid|we\s*have\s*paid|paid\s*amount|betrag|montant)/i;
function pickAmount(text){
  var c=[], m; MONEY_RE.lastIndex=0;
  while((m=MONEY_RE.exec(text))){
    var raw=m[2], v=num(raw); if(!v||Math.abs(v)>5e7) continue;
    var before=text.slice(Math.max(0,m.index-50), m.index);
    var cur=(m[1]||m[3]||'').replace('£','GBP').replace('€','EUR').replace('$','USD');
    var sc=0; if(AMOUNT_KW.test(before)) sc+=30; if(/total/i.test(before.slice(-25))) sc+=10; if(cur) sc+=3;
    if(/invoice|inv\b|vat|tax|discount/i.test(before.slice(-18))) sc-=5;
    c.push({v:Math.abs(v), sc:sc, cur:cur});
  }
  if(!c.length) return {amount:0, cur:''};
  var maxV=Math.max.apply(null,c.map(function(x){return x.v;}));
  c.forEach(function(x){ if(x.v===maxV) x.sc+=8; });
  c.sort(function(a,b){ return b.sc-a.sc || b.v-a.v; });
  return {amount:round2(c[0].v), cur:c[0].cur||(c.find(function(x){return x.cur;})||{}).cur||''};
}
function pickInvoices(text, c){
  var found={};
  (text.match(/\b17\d{5,9}\b/g)||[]).forEach(function(x){ found[x]=1; });
  (text.match(/\b(?:SI|INV|SINV|PSI)[-_]?\d{4,10}\b/gi)||[]).forEach(function(x){ found[x.toUpperCase()]=1; });
  if(c && c.stmt && c.stmt.items) c.stmt.items.forEach(function(it){ if(it.doc && text.indexOf(it.doc)>=0) found[it.doc]=1; });
  return Object.keys(found).slice(0,60);
}
// Who paid?  invoice numbers → sender email → sender domain → customer name in text
function matchRemitCustomer(r){
  var text=(r.text||'')+' '+(r.subject||'')+' '+(r.files||[]).join(' ');
  // 1. invoice numbers that appear on a stored statement
  var inv=(text.match(/\b17\d{5,9}\b/g)||[]);
  if(inv.length){
    var all=DB.get('nwi_stmts',{})||{}; var hits={};
    Object.keys(all).forEach(function(n){ (all[n].items||[]).forEach(function(it){ if(inv.indexOf(String(it.doc))>=0) hits[n]=(hits[n]||0)+1; }); });
    var best=Object.keys(hits).sort(function(a,b){ return hits[b]-hits[a]; })[0];
    if(best && custByName(best)) return {name:custByName(best).name, how:'invoice numbers', conf:'high'};
  }
  // 2/3. sender address and domain
  var from=String(r.from||'').toLowerCase(); var addr=(from.match(/[\w.+'-]+@[\w.-]+/)||[''])[0]; var dom=addr.split('@')[1]||'';
  if(addr){
    var ct=contacts();
    var byAddr=CUSTS.filter(function(c){ var e=(contactFor(c)+';'+((c.ar&&c.ar.email)||'')).toLowerCase(); return e.indexOf(addr)>=0; });
    if(byAddr.length===1) return {name:byAddr[0].name, how:'sender email', conf:'high'};
    if(dom && !GENERIC_DOMAINS.test(dom)){
      var byDom=CUSTS.filter(function(c){ return emailDomains(c).indexOf(dom)>=0; });
      if(byDom.length===1) return {name:byDom[0].name, how:'sender domain', conf:'high'};
      // domain word matches a customer name e.g. currys.co.uk → CURRYS
      var root=dom.split('.')[0].replace(/[^a-z0-9]/g,'');
      if(root.length>=4){ var byRoot=CUSTS.filter(function(c){ return normName(c.name).replace(/ /g,'').toLowerCase().indexOf(root)===0; }); if(byRoot.length===1) return {name:byRoot[0].name, how:'sender domain', conf:'medium'}; }
    }
  }
  // 4. customer name written in the remittance (longest whole-name match wins)
  var hay=' '+normName(text)+' ', best2=null, bl=0;
  CUSTS.forEach(function(c){ var n=normName(c.name); if(n.length>=5 && n.length>bl && hay.indexOf(' '+n+' ')>=0){ best2=c; bl=n.length; } });
  if(best2) return {name:best2.name, how:'name in remittance', conf:bl>=10?'medium':'low'};
  return {name:'', how:'not matched', conf:'none'};
}
// Build a remittance record from text + context
function buildRemit(text, ctx){
  var r={id:ctx.id||uid(), src:ctx.src||'upload', msgId:ctx.msgId||'', from:ctx.from||'', subject:ctx.subject||'', received:ctx.received||new Date().toISOString(),
    files:ctx.files||[], status:'new', addedAt:new Date().toISOString()};
  var clean=String(text||'').replace(/ /g,' ').replace(/[ \t]+/g,' ');
  r.text=clean.slice(0,6000);
  var pd=pickPayDate(clean, new Date(r.received)); r.payDate=ymd(pd.date); r.dateSrc=pd.src; r.dateHow=pd.how;
  var am=pickAmount(clean); r.amount=am.amount; r.currency=am.cur||'';
  var m=matchRemitCustomer(r); r.customer=m.name; r.how=m.how; r.conf=m.conf;
  var c=custByName(r.customer); r.invoices=pickInvoices(clean, c);
  if(!r.currency) r.currency=c?c.currency:'GBP';
  delete r.text; r.snippet=clean.slice(0,400);
  return r;
}
// Text out of an attachment / upload
async function textFromBytes(u8, name, mime){
  name=name||''; mime=mime||'';
  if(/pdf/i.test(mime)||/\.pdf$/i.test(name)) return await pdfText(u8.buffer.slice(u8.byteOffset, u8.byteOffset+u8.byteLength));
  if(/sheet|excel|csv/i.test(mime)||/\.(xlsx|xls|csv)$/i.test(name)){
    var wb=XLSX.read(u8,{type:'array',cellDates:true}); return wb.SheetNames.map(function(s){ return XLSX.utils.sheet_to_csv(wb.Sheets[s],{FS:'  '}); }).join('\n');
  }
  if(/html/i.test(mime)||/\.html?$/i.test(name)) return htmlToText(new TextDecoder().decode(u8));
  if(/text/i.test(mime)||/\.txt$/i.test(name)) return new TextDecoder().decode(u8);
  return '';
}
function htmlToText(h){
  var d=document.createElement('div');
  d.innerHTML=String(h||'').replace(/<(script|style)[\s\S]*?<\/\1>/gi,'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|tr|li|h\d)>/gi,'\n').replace(/<\/t[dh]>/gi,'  ');
  return (d.textContent||'').replace(/\n{3,}/g,'\n\n');
}
async function importRemitFiles(files){
  var a=remits(), n=0;
  for(var i=0;i<files.length;i++){
    var f=files[i];
    try{
      var u8=new Uint8Array(await readAsArrayBuffer(f));
      var text=await textFromBytes(u8, f.name, f.type);
      var r=buildRemit(text,{src:'upload', files:[f.name], subject:f.name, received:new Date(f.lastModified||Date.now()).toISOString()});
      a.unshift(r); n++;
    }catch(e){ toast('err','Could not read '+f.name, e.message); }
  }
  saveRemits(a); attachRemits();
  return n;
}
function attachRemits(){
  CUSTS.forEach(function(c){ c.remits=[]; });
  remits().forEach(function(r){ if(r.status==='ignored'||!r.customer) return; var c=custByName(r.customer); if(c) c.remits.push(r); });
}
// Remittances that are not yet reflected in the ledger (paid after the latest import)
function pendingRemits(c){
  var asOf=ledgerAsOf(); var a=asOf?ymd(asOf):'';
  return (c.remits||[]).filter(function(r){ return !a || r.payDate>=a; });
}
function remitsSince(c, since){ var s=ymd(since); return (c.remits||[]).filter(function(r){ return ymd(new Date(r.received))>=s || r.payDate>=s; }); }
function setRemit(id, patch){
  var a=remits(); var r=a.find(function(x){ return x.id===id; }); if(!r) return null;
  var before=JSON.parse(JSON.stringify(r));
  var wasConfirmed=r.status==='confirmed';
  Object.assign(r, patch);
  if(patch.customer!=null){ var cc=custByName(patch.customer); r.customer=cc?cc.name:String(patch.customer||'').trim(); r.how=r.customer?'set by you':'not matched'; r.conf=r.customer?'high':'none'; if(cc&&!patch.currency&&!before.currencySetByYou) r.currency=r.currency||cc.currency; }
  if(patch.amount!=null) r.amount=round2(num(patch.amount));
  // confirming logs the payment; un-confirming takes it back out and restores any promise it cleared
  if(r.status==='confirmed' && !wasConfirmed && r.customer && r.amount){
    var rec=recordPayment(r.customer, fromYMD(r.payDate)||today(), r.amount, r.currency||'GBP', 'remittance', r.id);
    r.paymentLogged=true; r.paymentId=rec.id; r.clearedPTP=rec.ptp||null;
  } else if(wasConfirmed && r.status!=='confirmed'){
    if(r.paymentId) removePayment(r.paymentId); else if(r.paymentLogged) removeLegacyRemitPayment(before);
    if(r.clearedPTP) restorePTP(before.customer, r.clearedPTP);
    r.paymentLogged=false; r.paymentId=''; r.clearedPTP=null;
  } else if(wasConfirmed && r.paymentId && (patch.amount!=null||patch.payDate!=null||patch.customer!=null||patch.currency!=null)){
    updatePayment(r.paymentId, {customer:r.customer, amount:r.amount, date:r.payDate, currency:r.currency||'GBP'});
  }
  saveRemits(a); attachRemits();
  return before;
}
// remittances confirmed before payments had ids: remove the matching payment line
function removeLegacyRemitPayment(r){
  var a=payments(), i=a.findIndex(function(p){ return p.source==='remittance' && p.customer===r.customer && Math.abs(p.amount-r.amount)<0.005 && p.date===r.payDate; });
  if(i>=0){ a.splice(i,1); DB.set('nwi_payments',a); }
}

// GMAIL — two ways to connect:
//   'worker'  Cloudflare keeps a long-lived Google refresh token → Gmail just works on every
//             device, no pop-ups, no expiry (recommended; see Settings → Gmail).
//   'popup'   Google sign-in pop-up; the token lasts ~1 hour and is renewed on your next click.
// ═══════════════════════════════════════════════════════════════════
var Gmail = {
  token:null, exp:0, email:'', client:null, pending:[], mode:function(){ return settings().gmailMode==='worker'?'worker':'popup'; },
  valid:function(){ return this.token && Date.now() < this.exp-60000; },
  setToken:function(t, ttl, email){
    this.token=t; this.exp=Date.now()+((ttl||3500)*1000); if(email) this.email=email;
    devSet('nwi_gmail_granted','1'); this.ui();
  },
  ui:function(){
    var on=this.valid();
    var b=$('gmail-chip'); if(b){ b.className='chip '+(on?'chip-ok':'chip-mute'); b.innerHTML='<span class="dot dot-'+(on?'ok':'off')+'"></span>'+(on?'Gmail':'Gmail off'); b.title=on?('Connected'+(this.email?' as '+this.email:'')):'Click to connect Gmail'; }
    var s=$('gmail-status'); if(s){ s.textContent=on?('Connected'+(this.email?' — '+this.email:'')+' · '+(this.mode()==='worker'?'via Cloudflare (no expiry)':'pop-up sign-in')):'Not connected'; s.className='pill '+(on?'pill-ok':'pill-mute'); }
  },
  // Get a token, then run fn(token). MUST be called from a click when using pop-up mode.
  use:function(fn, quiet){
    var self=this;
    if(this.valid()) return Promise.resolve(fn(this.token));
    if(this.mode()==='worker') return this.fromWorker().then(function(ok){ if(ok) return fn(self.token); if(!quiet) toast('warn','Gmail not connected via Cloudflare','Settings → Gmail → Connect through Cloudflare'); });
    if(typeof google==='undefined'||!google.accounts||!google.accounts.oauth2){ if(!quiet) toast('err','Google sign-in did not load','Check your connection and reload'); return Promise.resolve(); }
    return new Promise(function(res){
      self.pending.push(function(ok){ res(ok?fn(self.token):undefined); });
      if(!self.client){
        self.client=google.accounts.oauth2.initTokenClient({client_id:devGet('nwi_gmail_client_id','')||GMAIL_DEFAULT_CLIENT_ID,
          scope:'https://www.googleapis.com/auth/gmail.compose https://www.googleapis.com/auth/gmail.readonly',
          callback:function(r){ var ok=!!(r&&r.access_token); if(ok){ self.setToken(r.access_token, r.expires_in); self.profile(); } else if(!quiet) toast('warn','Gmail not connected', (r&&r.error)||'Sign-in was cancelled');
            var p=self.pending; self.pending=[]; p.forEach(function(f){ f(ok); }); },
          error_callback:function(e){ var p=self.pending; self.pending=[]; p.forEach(function(f){ f(false); }); if(!quiet) toast('warn','Gmail sign-in closed', e&&e.type||''); }
        });
      }
      try{ self.client.requestAccessToken({prompt: devGet('nwi_gmail_granted','')==='1'?'':'consent'}); }catch(e){ var p=self.pending; self.pending=[]; p.forEach(function(f){ f(false); }); }
    });
  },
  fromWorker:async function(){
    var c=Cloud.cfg(); if(!c.url||!c.key) return false;
    try{
      var r=await fetch(c.url+'/gauth/token',{headers:{'x-sync-key':c.key}, cache:'no-store'});
      if(!r.ok) return false;
      var d=await r.json(); if(!d.access_token) return false;
      this.setToken(d.access_token, d.expires_in||3500, d.email||''); return true;
    }catch(e){ return false; }
  },
  profile:function(){ var self=this; this.api('users/me/profile').then(function(d){ if(d&&d.emailAddress){ self.email=d.emailAddress; self.ui(); } }).catch(function(){}); },
  api:async function(path, opts){
    opts=opts||{}; var self=this;
    var go=function(){ return fetch('https://gmail.googleapis.com/gmail/v1/'+path, Object.assign({}, opts, {headers:Object.assign({}, opts.headers||{}, {Authorization:'Bearer '+self.token})})); };
    var r=await go();
    if(r.status===401){ this.token=null; if(this.mode()==='worker' && await this.fromWorker()) r=await go(); else { this.ui(); throw new Error('Gmail sign-in expired — click again to reconnect'); } }
    if(r.status===403){ var e=await r.json().catch(function(){ return {}; }); throw new Error((e.error&&e.error.message)||'Gmail permission denied'); }
    if(!r.ok){ var e2=await r.json().catch(function(){ return {}; }); throw new Error((e2.error&&e2.error.message)||('Gmail error '+r.status)); }
    return r.status===204?{}:r.json();
  },
  disconnect:function(){ try{ if(this.token&&google&&google.accounts) google.accounts.oauth2.revoke(this.token,function(){}); }catch(e){} this.token=null; this.exp=0; devSet('nwi_gmail_granted',''); this.ui(); toast('ok','Gmail disconnected',''); }
};

// ── Build a MIME message (HTML body + optional attachment) ──
function wrap76(b64){ return b64.replace(/(.{76})/g,'$1\r\n'); }
function mimeHeader(s){ return /^[\x20-\x7e]*$/.test(s)? s : '=?UTF-8?B?'+btoa(unescape(encodeURIComponent(s)))+'?='; }
function buildMime(o){
  var bnd='pp_'+Math.random().toString(36).slice(2), alt='ppa_'+Math.random().toString(36).slice(2), L=[];
  L.push('MIME-Version: 1.0');
  if(o.to) L.push('To: '+o.to.split(/[;,]/).map(function(x){return x.trim();}).filter(Boolean).join(', '));
  if(o.cc) L.push('Cc: '+o.cc.split(/[;,]/).map(function(x){return x.trim();}).filter(Boolean).join(', '));
  if(o.bcc) L.push('Bcc: '+o.bcc);
  L.push('Subject: '+mimeHeader(o.subject||''));
  var bodyPart=function(){
    var p=[]; p.push('Content-Type: multipart/alternative; boundary="'+alt+'"','', '--'+alt,'Content-Type: text/plain; charset="UTF-8"','Content-Transfer-Encoding: base64','',wrap76(btoa(unescape(encodeURIComponent(o.text||'')))),'--'+alt,'Content-Type: text/html; charset="UTF-8"','Content-Transfer-Encoding: base64','',wrap76(btoa(unescape(encodeURIComponent(o.html||'')))),'--'+alt+'--');
    return p.join('\r\n');
  };
  if(o.att && o.att.b64){
    L.push('Content-Type: multipart/mixed; boundary="'+bnd+'"','','--'+bnd, bodyPart(), '--'+bnd,
      'Content-Type: '+(o.att.mime||'application/pdf')+'; name="'+o.att.name.replace(/"/g,'')+'"','Content-Transfer-Encoding: base64','Content-Disposition: attachment; filename="'+o.att.name.replace(/"/g,'')+'"','',wrap76(o.att.b64),'--'+bnd+'--');
  } else { L.push(bodyPart()); }
  return L.join('\r\n');
}

async function readRemitMessage(id){

async function importAny(files){
  files=Array.prototype.slice.call(files||[]); if(!files.length) return;
  var did=[], remitFiles=[];
  for(var i=0;i<files.length;i++){
    var f=files[i];
    try{
      var kind=await detectLedgerKind(f);
      if(kind==='sa'||kind==='ar'){ var r=await importLedgerFile(f, kind); did.push((kind==='sa'?'Summary Aging':'Aged Receivables')+' ('+r.rows.length+')'); }
      else if(kind==='terms'){ var n=await importProfilesWorkbook(f); did.push('Payment types ('+n+')'); }
      else if(kind==='stmt'){ var sr=await importStatementGuess(f); did.push('Statement for '+sr.c.name+' — '+stmtSummary(sr.p.report)); }
      else if(kind==='remit'||/remit/i.test(f.name)){ remitFiles.push(f); }
      else { var choice=await askKind(f); if(choice==='sa'||choice==='ar'){ var r2=await importLedgerFile(f,choice); did.push(f.name+' ('+r2.rows.length+')'); } else if(choice==='stmt'){ var sr2=await importStatementGuess(f); did.push('Statement for '+sr2.c.name+' — '+stmtSummary(sr2.p.report)); } else if(choice==='remit') remitFiles.push(f); }
    }catch(e){ toast('err','Could not import '+f.name, e.message); }
  }
  if(remitFiles.length){ rebuild(); var n2=await importRemitFiles(remitFiles); did.push(n2+' remittance'+(n2===1?'':'s')); }
  rebuild(); _builtFor=ymd(today());
  if(did.length){ toast('ok','Imported', did.join(' · ')); recordDailyHistory(); snapshotForecast(); routineTick('import'); }
  renderAll();
}

async function importStatementGuess(f, forName){

    throw new Error(e.message+(fc?' The file is saved and will still be attached to emails.':''));
  }

        {foot:'<button class="btn" id="st-skip">Skip</button><button class="btn btn-p" id="st-ok">Save</button>'});
      qsa('#modal-body button[data-n]').forEach(function(b){ b.onclick=function(){ $('st-cust').value=b.dataset.n; }; });

    if(q && c.name.toLowerCase().indexOf(q)<0 && (c.code||'').toLowerCase().indexOf(q)<0) return false;

    if(CF.band==='OVER') return c.overLimit; if(CF.band==='QUERY') return c.queries.length>0; if(CF.band==='CREDIT') return c.balance<0;

}

// ── 87-reports.js ──
// ═══════════════════════════════════════════════════════════════════
// REPORTS — KPIs, trend, Friday one-pager, leadership scorecard
//   DSO   = trade ledger ÷ monthly credit sales × 30
//   BPDSO = not-yet-due ledger ÷ monthly credit sales × 30  (best possible DSO)
//   ADD   = DSO − BPDSO  (average days delinquent — the part chasing can fix)
//   CEI   = (opening AR + sales − closing AR) ÷ (opening AR + sales − closing overdue) × 100
// ═══════════════════════════════════════════════════════════════════
function history(){ var h=DB.get('nwi_daily_history',[]); return Array.isArray(h)?h:[]; }
function tradeTotals(){

  var ledger=sum(gb,function(c){ return Math.max(0,c.balance); }), od=sum(gb,function(c){ return c.overdue; });
  var partnerOD=sum(CUSTS.filter(function(c){ return c.currency==='GBP' && c.partner; }),function(c){ return c.overdue; });
  var byCur={}; CUSTS.forEach(function(c){ if(c.partner) return; byCur[c.currency]=(byCur[c.currency]||0)+c.overdue; });
  var qOpen=queries().filter(function(q){ return qStatus(q)!=='resolved'; });
  return {ledger:round2(ledger), overdue:round2(od), partnerOD:round2(partnerOD), byCur:byCur, notDue:round2(Math.max(0,ledger-od)), pct:ledger?od/ledger*100:0,
    qN:qOpen.length, qV:round2(sum(qOpen,function(q){ var c=custByName(q.customer); return fxToGBP(qAmount(q,c),c?c.currency:'GBP'); })),
    broken:Object.keys(ptps()).filter(isBrokenPTP).length, over:CUSTS.filter(function(c){ return c.overLimit && !c.partner; }).length, checks:CUSTS.filter(function(c){ return c.check; }).length};
}
function dsoFigures(t){

}

  var h=history().filter(function(x){ return x.day!==day; }); h.push(rec); h.sort(function(a,b){ return a.day<b.day?-1:1; });

function histAt(daysAgo){ var target=ymd(addDays(today(),-daysAgo)); var h=history().filter(function(x){ return x.day<=target; }); return h.length?h[h.length-1]:null; }

function cei(t){
  var sales=num(settings().monthlySales); if(!sales) return null;
  var ms=new Date(today().getFullYear(),today().getMonth(),1); var h=history().filter(function(x){ return x.day<ymd(ms); });
  var open=h.length?h[h.length-1]:history()[0]; if(!open||!open.totalAR) return null;
  var dim=new Date(ms.getFullYear(),ms.getMonth()+1,0).getDate(); var s=sales*today().getDate()/dim;
  var den=open.totalAR+s-t.overdue; if(den<=0) return null;

function nextActionFor(c){

var ANIM=true;
function countUp(root){
  if(REDUCED||!root) return;
  qsa('[data-count]',root).forEach(function(el){
    if(el.children.length) return; // only plain text values
    var final=el.textContent; var re=/\d[\d,]*(\.\d+)?/g; var nums=final.match(re); if(!nums) return;

      el.textContent=final.replace(re,function(m){ var dp=(m.split('.')[1]||'').length, n=parseFloat(m.replace(/,/g,''))*e; var s=n.toLocaleString('en-GB',{minimumFractionDigits:dp,maximumFractionDigits:dp}); if(m.indexOf(',')<0&&n>=1000) s=s.replace(/,/g,''); i++; return s; });
      if(p<1) requestAnimationFrame(step); else el.textContent=final;
    };
    requestAnimationFrame(step);
  });

// ── confetti ──
function confetti(n, origin){
  if(REDUCED) return; var cv=$('confetti'); if(!cv) return;
  var ctx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  var cols=['#6D4AFF','#C026D3','#F43F5E','#F5B014','#10B981','#3B82F6','#FFD666'];
  var ox=origin?origin.x:innerWidth/2, oy=origin?origin.y:innerHeight/3, P=[];
  for(var i=0;i<(n||140);i++) P.push({x:ox,y:oy,vx:(Math.random()-.5)*14,vy:Math.random()*-12-3,r:Math.random()*6+3,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.3,life:0});
  var t0=performance.now();
  (function frame(t){
    var dt=(t-t0); ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(function(p){ p.vy+=0.35; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.globalAlpha=Math.max(0,1-dt/2200); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if(dt<2200) requestAnimationFrame(frame); else ctx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}
function cheer(title, msg, big){ toast('ok', title, msg); confetti(big?180:70); }

// ── splash (once a day, tap to skip) ──
function splash(){
  if(REDUCED || navigator.webdriver || VIEWER) return;
  var d=ymd(today()); if(devGet('pp_splash','')===d) return; devSet('pp_splash', d);
  var s=document.createElement('div'); s.id='splash';
  var stars=''; for(var i=0;i<40;i++) stars+='<i class="trail" style="left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;animation-delay:'+(Math.random()*2)+'s"></i>';
  s.innerHTML=stars+'<div class="sp-mark"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10 14"/><path d="m21 3-6.5 18-3.5-7-7-3.5Z"/></svg></div><div class="sp-t">Pay<span>Pilot</span></div><div class="sp-s">Chase · Collect · Forecast</div><div class="sp-skip">tap to skip</div>';
  document.body.appendChild(s);
  var done=function(){ if(!s.parentNode) return; s.classList.add('out'); setTimeout(function(){ s.remove(); maybeBriefing(); },500); };
  s.onclick=done; setTimeout(done, 1900);
  return true;
}

// ── streak (working days in a row with every daily quest done) ──
function markDayComplete(){ var o=DB.get('nwi_routine',{})||{}; var d=ymd(today()); if(o[d]&&o[d]._all) return false; routineTick('_all'); return true; }
function streakDays(){
  var o=DB.get('nwi_routine',{})||{}, n=0, d=today();
  if(!(o[ymd(d)]&&o[ymd(d)]._all)) d=addWorkingDays(d,-1);   // today not finished yet doesn't break it
  for(var i=0;i<60;i++){ if(!isWorkingDay(d)){ d=addDays(d,-1); continue; } if(o[ymd(d)]&&o[ymd(d)]._all){ n++; d=addWorkingDays(d,-1); } else break; }
  return n;
}
function renderStreak(){
  var el=$('streak-card'); if(!el) return;
  var run=currentRun(), items=CUSTS.length?routineItems(run, run?runRows(run):[]):[];
  var done=items.filter(function(i){ return i.done; }).length, n=streakDays();
  el.innerHTML='<span class="fire">'+(n?'🔥':'🌱')+'</span><div><b>'+n+'-day streak</b><div class="xs muted">'+done+'/'+(items.length||0)+' quests today</div></div>';
}

// ── morning briefing (first open each day) ──
function maybeBriefing(){
  if(navigator.webdriver || VIEWER || !CUSTS.length) return;
  var d=ymd(today()); if(devGet('pp_brief','')===d) return; devSet('pp_brief', d);
  openBriefing(false);
}
function greeting(){ var h=new Date().getHours(); return h<12?'Good morning':h<17?'Good afternoon':'Good evening'; }
function openBriefing(manual){
  if(!CUSTS.length){ toast('info','Import the ledger first','Then your briefing appears here each morning'); return; }
  var run=currentRun(), rows=run?runRows(run):[], s=runSummary(rows,'GBP'), wd=run?workingDaysBetween(today(),run.date):0;
  var nr=remits().filter(function(r){ return r.status==='new'; }).length;
  var qd=queries().filter(function(q){ return qStatus(q)!=='resolved' && (qActionDue(q)||qSla(q).cls==='bad'); }).length;
  var pd=Object.keys(ptps()).filter(function(n){ var p=ptps()[n]; return p.date===ymd(today()) || isBrokenPTP(n); }).length;
  var fc=buildForecast({currency:'GBP', weeks:1});
  var age=ledgerAgeDays();
  var items=[
    ['🛫','var(--lilac)', run? '<b>'+run.label+' run '+(wd===0?'is today':'in '+wd+' working day'+(wd===1?'':'s'))+'</b> — '+fmtDw(run.date)+(chaseWindowOpen(run)?' · chase window open':'') : 'No run coming up'],
    ['🎯','var(--pink)', s.chaseLeft? '<b>'+s.chaseLeft+' customers</b> still to chase — '+money0(s.chaseAmt)+' overdue' : '<b>Chase list clear</b> for this run 🎉'],
    ['💷','var(--mint)', '<b>'+money0(fc.weeks[0].total)+'</b> expected in this week'],
    ['📨','var(--sky)', nr? '<b>'+nr+' remittance'+(nr===1?'':'s')+'</b> waiting to confirm' : 'No remittances waiting — scan the Remits folder'],
    ['💬','var(--peach)', qd? '<b>'+qd+' quer'+(qd===1?'y':'ies')+'</b> need action today' : 'Every query is on track'],
  ];
  if(pd) items.push(['🤝','var(--lemon)','<b>'+pd+' promise'+(pd===1?'':'s')+'</b> due today or broken']);
  if(age>0) items.unshift(['📥','var(--warn-bg)','<b>Import today’s reports</b> — ledger is '+age+' working day'+(age>1?'s':'')+' old']);
  var n=streakDays();
  openModal('Morning briefing', '<div class="brief-head"><span class="big">'+(new Date().getHours()<12?'☀️':'🌤️')+'</span><div><h2>'+greeting()+', '+esc(settings().signature||'Pavi')+'</h2><div class="muted small">'+fmtDl(today())+' · '+(n?'🔥 '+n+'-day streak — keep it going':'Finish today’s quests to start a streak')+'</div></div></div>'+
    '<div class="brief">'+items.map(function(i){ return '<div class="brief-item"><span class="ico" style="background:'+i[1]+'">'+i[0]+'</span><div>'+i[2]+'</div></div>'; }).join('')+'</div>',
    {foot:'<button class="btn" onclick="closeModal()">Later</button><button class="btn btn-p" onclick="closeModal();go(\'today\')">Let’s go 🚀</button>', noFocus:true});
}

function pdfLib(){
  if(window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
  toast('err','PDF library not loaded','Check your connection and reload'); return null;
}
function pdfDoc(title, sub, landscape){
  var J=pdfLib(); if(!J) return null;
  var doc=new J({orientation:landscape?'landscape':'portrait', unit:'pt', format:'a4'});
  var W=doc.internal.pageSize.getWidth();
  // gradient-ish header band
  var cols=[[59,130,246],[109,74,255],[192,38,211],[244,63,94]];
  for(var i=0;i<60;i++){ var t=i/59, k=Math.min(2,Math.floor(t*3)), f=t*3-k, a=cols[k], b=cols[k+1]; doc.setFillColor(a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f); doc.rect(W*i/60, 0, W/60+1, 64, 'F'); }
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text(title, 32, 34);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.text(sub||'', 32, 50);
  doc.setFontSize(9); doc.text('PayPilot · New Way International', W-32, 34, {align:'right'});
  doc.setTextColor(21,26,54);
  return doc;
}
function pdfFooter(doc){
  var n=doc.internal.getNumberOfPages(), W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
  for(var i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(140,146,176); doc.text('Generated '+fmtD(today())+' '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' · page '+i+' of '+n, W/2, H-16, {align:'center'}); }
}
function pdfTable(doc, head, body, opts){
  opts=opts||{};
  doc.autoTable(Object.assign({head:[head], body:body, startY:opts.startY||80, margin:{left:32,right:32},
    styles:{font:'helvetica', fontSize:opts.small?7.5:8.5, cellPadding:4, lineColor:[233,235,245], lineWidth:0.5, textColor:[21,26,54]},
    headStyles:{fillColor:[109,74,255], textColor:255, fontStyle:'bold'}, alternateRowStyles:{fillColor:[248,249,254]},
    didParseCell:opts.paint||null}, opts.extra||{}));
  return doc.lastAutoTable.finalY;
}
function pdfSave(doc, name){ pdfFooter(doc); doc.save(name); toast('ok','PDF downloaded', name); }

function pdfForecast(){
  var fc=_fc||buildForecast({weeks:FCO.weeks||8, currency:FCO.cur||'GBP'}); var cs=fc.currency==='ALL'?'GBP':fc.currency;
  var doc=pdfDoc('Cash receipts forecast', 'Next '+fc.nW+' weeks · '+(fc.currency==='ALL'?'all currencies in £':cs)+(fc.asOf?' · ledger as at '+fmtD(fc.asOf):''), true); if(!doc) return;
  var head=['',].concat(fc.weeks.map(function(w){ return 'w/c '+fmtDs(w.start); })).concat(['Later','Total']);
  var row=function(l,k){ return [l].concat(fc.weeks.map(function(w){ return money0(w[k],cs); })).concat(['',money0(fc.tot[k],cs)]); };
  var y=pdfTable(doc, head, [row('Committed','committed'),row('Expected','expected'),row('At risk','risk'),
    ['Total receipts'].concat(fc.weeks.map(function(w){ return money0(w.total,cs); })).concat([money0(fc.tot.later,cs),money0(fc.tot.horizon+fc.tot.later,cs)]),
    ['Held in queries (excluded)'].concat(fc.weeks.map(function(){ return ''; })).concat(['',money0(fc.tot.query,cs)])],
    {paint:function(d){ if(d.section==='body'&&d.row.index===3){ d.cell.styles.fontStyle='bold'; d.cell.styles.fillColor=[240,235,255]; } if(d.section==='body'&&d.row.index===4){ d.cell.styles.textColor=[234,88,12]; } if(d.section==='body'&&d.column.index>0) d.cell.styles.halign='right'; }});
  pdfTable(doc, ['Customer','Pays'].concat(fc.weeks.map(function(w){ return fmtDs(w.start); })).concat(['Later','Query','Total']),
    fc.rows.map(function(r){ return [r.c.name, RUN_LABEL[r.c.run]].concat(r.w.map(function(x){ var v=x.committed+x.expected+x.risk; return v<0.5?'—':money0(v,cs); })).concat([r.later>0.5?money0(r.later,cs):'—', r.query>0.5?money0(r.query,cs):'—', money0(r.total,cs)]); }),
    {startY:y+18, small:true, paint:function(d){ if(d.section==='body'&&d.column.index>1) d.cell.styles.halign='right'; }});
  pdfSave(doc, 'PayPilot cash forecast '+ymd(today())+'.pdf');
}

// ── PDF statement from parsed lines (for emailing an Excel statement as a PDF) ──
function statementPdf(c, run){
  var J=pdfLib(); if(!J||!c.stmt) return null;
  var doc=pdfDoc('Statement of account', c.name+(c.code?' ('+c.code+')':'')+' · as at '+fmtD(today()));
  var t=today(), rd=run?run.date:addDays(t,7), qs=queryInvoiceSet(c);
  var dueOf=function(it){ var d=stmtDue(it,c); return d?ymd(d):''; };
  var items=c.stmt.items.slice().sort(function(a,b){ return dueOf(a)<dueOf(b)?-1:1; });
  var stOf=function(it){ var d=stmtDue(it,c); if(it.amt<0) return 'Credit'; if(!d||d<t) return 'Overdue'; if(d<=rd) return 'Becoming due'; return 'Not yet due'; };
  var y=pdfTable(doc, ['Document','Your ref.','Type','Due date','Status','Amount'], items.map(function(it){ return [it.doc, it.ext||'', it.type, dueOf(it)?fmtD(fromYMD(dueOf(it))):'', stOf(it)+(qs[String(it.doc).toLowerCase()]?' · query':''), money(it.amt,c.currency)]; }),
    {paint:function(d){ if(d.section!=='body') return; var s=stOf(items[d.row.index]); if(s==='Overdue'){ d.cell.styles.fillColor=[253,232,232]; if(d.column.index>=3) d.cell.styles.textColor=[185,28,28]; } else if(s==='Becoming due'){ d.cell.styles.fillColor=[255,244,214]; } if(d.column.index===5) d.cell.styles.halign='right'; }});
  var tot=sum(items,function(i){ return i.amt; }), od=sum(items.filter(function(i){ return stOf(i)==='Overdue'; }),function(i){ return i.amt; });
  pdfTable(doc, ['', ''], [['Total overdue', money(od,c.currency)],['Balance on account', money(tot,c.currency)]], {startY:y+12, extra:{showHead:'never', columnStyles:{0:{fontStyle:'bold'},1:{halign:'right',fontStyle:'bold'}}, tableWidth:260, margin:{left:doc.internal.pageSize.getWidth()-292}}});
  pdfFooter(doc);
  var uri=doc.output('datauristring');
  return {b64:uri.split(',')[1], name:'Statement '+c.name.replace(/[^\w\- ]+/g,'').trim()+' '+fmtD(today()).replace(/\//g,'-')+'.pdf', mime:'application/pdf', at:Date.now(), generated:true};
}
function downloadStatementPdf(name){
  var c=custByName(name); if(!c||!c.stmt){ toast('warn','No statement on file','Drop the customer statement first'); return; }
  var s=statementPdf(c, nextRunFor(c,today())); if(!s) return;
  downloadBlob(new Blob([base64ToU8(s.b64)],{type:'application/pdf'}), s.name);
}
